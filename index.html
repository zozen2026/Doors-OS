                    </section>

                    <!-- قسم المظهر والمؤشر -->
                    <section id="sec-appearance" class="space-y-5 hidden">
                        <h2 class="text-lg font-extrabold text-slate-800">المظهر والمؤشر الخاص</h2>
                        <div class="bg-white border border-slate-200 rounded-2xl p-5">
                            <h3 class="font-bold text-sm mb-3">خلفيات Doors الجاهزة</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${wpCards}</div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3">
                            <h3 class="font-bold text-sm">خلفية مخصصة برابط صورة (URL)</h3>
                            <div class="flex gap-2">
                                <input id="custom-wp-url" type="url" value="${userData.settings.customWallpaperUrl || ''}" placeholder="https://example.com/wallpaper.jpg" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-orange-500">
                                <button onclick="applyCustomWp()" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold">تطبيق</button>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl p-5 flex items-center justify-between">
                            <div>
                                <div class="font-bold text-sm">مؤشر Doors المخصص</div>
                                <div class="text-xs text-slate-500">استبدال مؤشر الماوس التقليدي بمؤشر Doors البرتقالي الخاص</div>
                            </div>
                            <input type="checkbox" id="toggle-cursor" ${userData.settings.customCursor !== false ? 'checked' : ''} onchange="toggleCursor(this.checked)" class="w-5 h-5 accent-orange-600">
                        </div>
                    </section>

                    <!-- قسم التخزين والنظام -->
                    <section id="sec-storage" class="space-y-5 hidden">
                        <h2 class="text-lg font-extrabold text-slate-800">معلومات النظام والتخزين</h2>
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="bg-white border border-slate-200 rounded-2xl p-4">
                                <div class="text-2xl font-extrabold text-indigo-600">${appsCount}</div>
                                <div class="text-xs text-slate-500 mt-1">التطبيقات المثبتة</div>
                            </div>
                            <div class="bg-white border border-slate-200 rounded-2xl p-4">
                                <div class="text-2xl font-extrabold text-amber-500">${foldersCount}</div>
                                <div class="text-xs text-slate-500 mt-1">المجلدات</div>
                            </div>
                            <div class="bg-white border border-slate-200 rounded-2xl p-4">
                                <div class="text-2xl font-extrabold text-sky-600">${docsCount}</div>
                                <div class="text-xs text-slate-500 mt-1">المستندات والملفات</div>
                            </div>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3">
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">إصدار النواة:</span>
                                <span class="font-bold">Doors Sovereign v2.0 (Iframe Engine)</span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">حالة خادم Supabase:</span>
                                <span class="font-bold text-emerald-600">متصل ونشط</span>
                            </div>
                            <div class="pt-2 border-t border-slate-100">
                                <button onclick="sendMsg('resetPositions')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-table-cells ml-1"></i> إعادة ترتيب أيقونات سطح المكتب
                                </button>
                            </div>
                        </div>
                    </section>
                </main>

                <script>
                    function sendMsg(action, payload = {}) {
                        window.parent.postMessage({ source: 'doors_settings', action, payload }, '*');
                    }
                    function showSection(name) {
                        ['account', 'appearance', 'storage'].forEach(s => {
                            document.getElementById('sec-' + s).classList.toggle('hidden', s !== name);
                            const btn = document.getElementById('nav-' + s);
                            btn.className = s === name
                                ? 'nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl bg-orange-50 text-orange-600 transition'
                                : 'nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition';
                        });
                    }
                    function updateName() {
                        const val = document.getElementById('new-fullname').value.trim();
                        if (!val) return;
                        sendMsg('updateName', { fullname: val });
                        document.getElementById('save-name-msg').classList.remove('hidden');
                    }
                    function setWallpaper(key) {
                        sendMsg('setWallpaper', { wallpaper: key, customUrl: '' });
                    }
                    function applyCustomWp() {
                        const url = document.getElementById('custom-wp-url').value.trim();
                        sendMsg('setWallpaper', { wallpaper: 'sovereign', customUrl: url });
                    }
                    function toggleCursor(val) {
                        sendMsg('toggleCursor', { enabled: val });
                    }
                <\/script>
                ${getIframeCustomCursorCode()}
            </body>
            </html>`;
        }

        // بناء HTML مستقل تماماً لمتجر زوزين داخل Iframe مع اتصال Supabase
        function buildStoreIframeHTML() {
            return `<!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
                <script src="https://cdn.tailwindcss.com"><\/script>
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
                    body { font-family: 'Cairo', sans-serif; margin:0; background:#f8fafc; color:#0f172a; }
                </style>
            </head>
            <body class="p-6 overflow-y-auto">
                <div class="max-w-4xl mx-auto space-y-7">
                    <!-- رأس المتجر -->
                    <div class="bg-gradient-to-l from-indigo-600 to-violet-600 text-white rounded-2xl p-5 flex items-center justify-between shadow-lg">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-store"></i></div>
                            <div>
                                <h1 class="text-lg font-extrabold">Zozen Store السحابي</h1>
                                <p class="text-xs text-indigo-100">تثبيت التطبيقات مباشرة على سطح مكتب Doors وبوابة المطورين</p>
                            </div>
                        </div>
                        <span class="text-[11px] bg-emerald-400/25 border border-emerald-300/40 px-3 py-1 rounded-full font-bold">
                            <i class="fa-solid fa-cloud ml-1"></i> Supabase متصل
                        </span>
                    </div>

                    <!-- تطبيقات السحابة -->
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="text-base font-extrabold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-cloud text-emerald-600"></i> تطبيقات السحابة (Supabase Cloud Hub)</h2>
                            <button onclick="loadCloudApps()" class="text-xs font-bold text-indigo-600 hover:underline"><i class="fa-solid fa-rotate ml-1"></i> تحديث</button>
                        </div>
                        <div id="cloud-apps-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                            <div class="col-span-full text-center py-10 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> جاري جلب التطبيقات من Supabase...</div>
                        </div>
                    </div>

                    <!-- بوابة المطورين -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                        <h3 class="text-sm font-extrabold text-orange-600 mb-4 flex items-center gap-2"><i class="fa-solid fa-code"></i> بوابة المطورين (نشر تطبيق جديد إلى Supabase)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">اسم التطبيق *</label>
                                <input type="text" id="dev-app-name" placeholder="مثال: تطبيق زوزين الذكي" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">الشركة أو الجهة المطورة</label>
                                <input type="text" id="dev-company-name" placeholder="مثال: Zozen Corp" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">اسم المطور الشخصي</label>
                                <input type="text" id="dev-person-name" placeholder="اسمك" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">الإصدار (Version)</label>
                                <input type="text" id="dev-app-version" value="1.0.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block font-bold mb-1 text-slate-700">رابط التطبيق المباشر (URL) *</label>
                                <input type="url" id="dev-app-url" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block font-bold mb-1 text-slate-700">الوصف</label>
                                <textarea id="dev-app-desc" rows="2" placeholder="وصف مختصر للتطبيق..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500"></textarea>
                            </div>
                        </div>
                        <button onclick="publishApp()" id="publish-btn" class="mt-4 w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition shadow text-xs">
                            <i class="fa-solid fa-cloud-arrow-up ml-1"></i> رفع ونشر التطبيق إلى Supabase
                        </button>
                    </div>
                </div>

                <script>
                    const sb = supabase.createClient("${SUPABASE_URL}", "${SUPABASE_ANON_KEY}");
                    let fetchedCloudApps = [];

                    async function loadCloudApps() {
                        const grid = document.getElementById('cloud-apps-grid');
                        grid.innerHTML = '<div class="col-span-full text-center py-8 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> جاري الاتصال بـ Supabase...</div>';
                        try {
                            const { data: apps, error } = await sb.from('apps').select('*').order('id', { ascending: false });
                            if (error) throw error;
                            fetchedCloudApps = apps || [];

                            if (fetchedCloudApps.length === 0) {
                                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 text-xs py-6">لا توجد تطبيقات سحابية حالياً.</p>';
                                return;
                            }

                            grid.innerHTML = '';
                            fetchedCloudApps.forEach((app, idx) => {
                                const card = document.createElement('div');
                                card.className = 'bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-3';
                                card.innerHTML = \`
                                    <div class="flex items-center gap-3 min-w-0">
                                        <div class="w-12 h-12 shrink-0 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-cloud"></i></div>
                                        <div class="min-w-0">
                                            <h4 class="font-bold text-sm text-slate-800 truncate">\${app.name || 'تطبيق سحابي'}</h4>
                                            <p class="text-[11px] text-slate-500 truncate">\${app.developer || 'مطور سحابي'}</p>
                                            <p class="text-[10px] text-emerald-600 truncate mt-0.5">\${app.description || 'تطبيق Doors السحابي'}</p>
                                        </div>
                                    </div>
                                    <button onclick="installCloud(\${idx})" class="shrink-0 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow">تثبيت</button>
                                \`;
                                grid.appendChild(card);
                            });
                        } catch (err) {
                            grid.innerHTML = '<p class="col-span-full text-center text-red-500 text-xs py-6">فشل الاتصال بـ Supabase: ' + err.message + '</p>';
                        }
                    }

                    function installCloud(idx) {
                        const app = fetchedCloudApps[idx];
                        if (!app) return;
                        window.parent.postMessage({
                            source: 'doors_store',
                            action: 'installApp',
                            payload: {
                                name: app.name || 'تطبيق سحابي',
                                url: app.exe_url || app.file_url || '#',
                                developer: app.developer || 'مطور سحابي',
                                desc: app.description || 'تطبيق سحابي من متجر زوزين'
                            }
                        }, '*');
                    }

                    async function publishApp() {
                        const name = document.getElementById('dev-app-name').value.trim();
                        const company = document.getElementById('dev-company-name').value.trim() || 'Zozen Developer';
                        const person = document.getElementById('dev-person-name').value.trim();
                        const version = document.getElementById('dev-app-version').value.trim() || '1.0';
                        const url = document.getElementById('dev-app-url').value.trim();
                        const desc = document.getElementById('dev-app-desc').value.trim();
                        const btn = document.getElementById('publish-btn');

                        if (!name || !url) {
                            alert('يرجى إدخال اسم التطبيق والرابط المباشر.');
                            return;
                        }
                        btn.disabled = true;
                        btn.textContent = 'جاري الرفع...';
                        try {
                            const { error } = await sb.from('apps').insert([{
                                name,
                                developer: company + (person ? ' (' + person + ')' : ''),
                                description: desc || 'إصدار v' + version,
                                exe_url: url
                            }]);
                            if (error) throw error;
                            alert('تم نشر التطبيق بنجاح في Supabase!');
                            document.getElementById('dev-app-name').value = '';
                            document.getElementById('dev-app-url').value = '';
                            document.getElementById('dev-app-desc').value = '';
                            loadCloudApps();
                        } catch (err) {
                            alert('فشل النشر: ' + err.message);
                        } finally {
                            btn.disabled = false;
                            btn.textContent = 'رفع ونشر التطبيق إلى Supabase';
                        }
                    }

                    loadCloudApps();
                <\/script>
                ${getIframeCustomCursorCode()}
            </body>
            </html>`;
        }

        // استقبال الرسائل من نوافذ الإعدادات والمتجر (postMessage)
        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (!msg || !msg.source) return;

            if (msg.source === 'doors_settings') {
                if (msg.action === 'updateName') {
                    const db = getAccountsDB();
                    currentUser.fullname = msg.payload.fullname;
                    db[currentUser.username] = currentUser;
                    saveAccountsDB(db);
                    updateAccountUI();
                } else if (msg.action === 'setWallpaper') {
                    userData.settings.wallpaper = msg.payload.wallpaper;
                    userData.settings.customWallpaperUrl = msg.payload.customUrl || '';
                    saveUserData();
                    applySystemSettings();
                } else if (msg.action === 'toggleCursor') {
                    userData.settings.customCursor = msg.payload.enabled;
                    saveUserData();
                    applySystemSettings();
                    // إعادة بناء الإعدادات لتطبيق تغيير المؤشر داخلها
                    const iframe = document.getElementById('iframe-settings');
                    if (iframe) iframe.srcdoc = buildSettingsIframeHTML();
                } else if (msg.action === 'resetPositions') {
                    userData.positions = {};
                    saveUserData();
                    renderDesktop();
                } else if (msg.action === 'logout') {
                    logoutSession();
                }
            }

            if (msg.source === 'doors_store' && msg.action === 'installApp') {
                const { name, url, developer, desc } = msg.payload;
                if (userData.customApps.some(a => a.url === url)) {
                    showInfoDialog('مثبت مسبقاً', `التطبيق "${name}" موجود بالفعل على سطح مكتبك.`);
                    return;
                }
                userData.customApps.push({
                    id: 'cloud_' + Date.now(),
                    title: name,
                    type: 'url',
                    url,
                    company: developer,
                    desc,
                    icon: 'fa-solid fa-cloud',
                    bg: 'bg-emerald-600',
                    isDefault: false
                });
                saveUserData();
                renderDesktop();
                renderStartApps();
                showInfoDialog('تم التثبيت بنجاح', `تم تثبيت "${name}" على سطح مكتب Doors ويمكنك الآن تشغيله في نافذة مستقلة أو حذفه متى شئت.`);
            }
        });

        // =========================================================================
        // 7. مستعرض المجلدات ومحرر المستندات الشخصية
        // =========================================================================
        function openFSItem(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;

            if (item.type === 'folder') {
                openFolderWindow(item.id);
            } else {
                openDocumentWindow(item.id);
            }
        }

        function openFolderWindow(folderId) {
            const folder = userData.fsItems.find(i => i.id === folderId);
            if (!folder) return;

            const winId = 'folder_' + folderId;
            if (openWindows[winId]) {
                focusWindow(winId);
                renderFolderContents(folderId);
                return;
            }

            createOSWindow({
                id: winId,
                title: folder.name,
                icon: 'fa-solid fa-folder-open',
                iconBg: 'bg-amber-500',
                width: 680,
                height: 460,
                contentHtml: `
                    <div dir="rtl" class="h-full flex flex-col bg-slate-50">
                        <div class="p-3 bg-white border-b border-slate-200 flex items-center justify-between gap-2 text-xs">
                            <div class="font-bold text-slate-600 flex items-center gap-2">
                                <i class="fa-solid fa-folder text-amber-500"></i>
                                <span>سطح المكتب / ${folder.name}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="createNewItemPrompt('folder', '${folderId}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-xl font-bold transition"><i class="fa-solid fa-folder-plus ml-1"></i> مجلد</button>
                                <button onclick="createNewItemPrompt('doc', '${folderId}')" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 px-3 py-1.5 rounded-xl font-bold transition"><i class="fa-solid fa-file-circle-plus ml-1"></i> مستند شخصي</button>
                            </div>
                        </div>
                        <div id="folder-grid-${folderId}" class="flex-1 p-4 grid grid-cols-3 sm:grid-cols-5 gap-3 content-start overflow-y-auto"></div>
                    </div>
                `
            });

            renderFolderContents(folderId);
        }

        function renderFolderContents(folderId) {
            const grid = document.getElementById('folder-grid-' + folderId);
            if (!grid) return;
            const children = userData.fsItems.filter(i => i.parentId === folderId);

            if (children.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs"><i class="fa-regular fa-folder-open text-3xl mb-2 block text-slate-300"></i>هذا المجلد فارغ. أنشئ مجلداً فرعياً أو مستنداً جديداً من الأعلى.</div>`;
                return;
            }

            grid.innerHTML = '';
            children.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flex flex-col items-center p-2.5 rounded-xl hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200 transition text-center';
                const icon = item.type === 'folder'
                    ? '<div class="w-12 h-12 bg-amber-400 text-white rounded-xl flex items-center justify-center text-xl mb-1.5 shadow"><i class="fa-solid fa-folder"></i></div>'
                    : '<div class="w-12 h-12 bg-sky-500 text-white rounded-xl flex items-center justify-center text-xl mb-1.5 shadow"><i class="fa-solid fa-file-lines"></i></div>';

                card.innerHTML = `${icon}<span class="text-[11px] font-bold text-slate-700 line-clamp-2">${item.name}</span>`;
                card.onclick = () => openFSItem(item.id);
                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showContextMenu(e.clientX, e.clientY, 'fs', item);
                };
                grid.appendChild(card);
            });
        }

        function openDocumentWindow(docId) {
            const doc = userData.fsItems.find(i => i.id === docId);
            if (!doc) return;

            const winId = 'doc_' + docId;
            if (openWindows[winId]) {
                focusWindow(winId);
                return;
            }

            createOSWindow({
                id: winId,
                title: doc.name,
                icon: doc.type === 'note' ? 'fa-solid fa-note-sticky' : 'fa-solid fa-file-lines',
                iconBg: doc.type === 'note' ? 'bg-amber-500' : 'bg-sky-600',
                width: 660,
                height: 490,
                contentHtml: `
                    <div dir="rtl" class="h-full flex flex-col bg-white">
                        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs">
                            <div class="flex items-center gap-2">
                                <button onclick="saveDocumentContent('${docId}')" class="bg-orange-600 hover:bg-orange-500 text-white px-3.5 py-1.5 rounded-lg font-bold transition"><i class="fa-solid fa-floppy-disk ml-1"></i> حفظ</button>
                                <button onclick="downloadDocument('${docId}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition"><i class="fa-solid fa-download ml-1"></i> تنزيل .txt</button>
                            </div>
                            <span id="doc-status-${docId}" class="text-[11px] text-emerald-600 font-bold">محفوظ في حسابك</span>
                        </div>
                        <textarea id="doc-editor-${docId}" oninput="autoSaveDocument('${docId}')" class="flex-1 w-full p-5 text-sm leading-relaxed text-slate-800 focus:outline-none resize-none ${doc.type === 'note' ? 'bg-amber-50/40' : 'bg-white'}" placeholder="اكتب مستندك الشخصي هنا..."></textarea>
                    </div>
                `
            });

            document.getElementById('doc-editor-' + docId).value = doc.content || '';
        }

        function autoSaveDocument(docId) {
            const doc = userData.fsItems.find(i => i.id === docId);
            const ta = document.getElementById('doc-editor-' + docId);
            if (!doc || !ta) return;
            doc.content = ta.value;
            doc.updatedAt = new Date().toISOString();
            saveUserData();
            const statusEl = document.getElementById('doc-status-' + docId);
            if (statusEl) statusEl.textContent = 'تم الحفظ تلقائياً ✓';
        }

        function saveDocumentContent(docId) {
            autoSaveDocument(docId);
            const statusEl = document.getElementById('doc-status-' + docId);
            if (statusEl) statusEl.textContent = 'تم الحفظ بنجاح ✓';
        }

        function downloadDocument(docId) {
            const doc = userData.fsItems.find(i => i.id === docId);
            if (!doc) return;
            const blob = new Blob([doc.content || ''], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = doc.name.endsWith('.txt') ? doc.name : doc.name + '.txt';
            a.click();
        }

        // إنشاء مجلد / مستند / ملاحظة / اختصار تطبيق
        function createNewItemPrompt(type, parentId = 'desktop') {
            const labels = {
                folder: { title: 'إنشاء مجلد جديد', placeholder: 'اسم المجلد...', def: 'مجلد جديد' },
                doc: { title: 'إنشاء مستند شخصي جديد', placeholder: 'اسم المستند...', def: 'مستند جديد.doc' },
                note: { title: 'إنشاء ملاحظة سريعة', placeholder: 'عنوان الملاحظة...', def: 'ملاحظة سريعة' }
            };
            const cfg = labels[type];

            openDialog(cfg.title, `
                <div class="space-y-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">الاسم</label>
                        <input type="text" id="prompt-item-name" value="${cfg.def}" placeholder="${cfg.placeholder}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button onclick="closeDialog()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold">إلغاء</button>
                        <button onclick="confirmCreateItem('${type}', '${parentId}')" class="px-5 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold">إنشاء</button>
                    </div>
                </div>
            `);
            setTimeout(() => {
                const inp = document.getElementById('prompt-item-name');
                if (inp) { inp.focus(); inp.select(); }
            }, 30);
        }

        function confirmCreateItem(type, parentId) {
            const name = document.getElementById('prompt-item-name').value.trim();
            if (!name) return;

            const newItem = {
                id: type + '_' + Date.now(),
                parentId,
                type,
                name,
                content: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            userData.fsItems.push(newItem);
            saveUserData();
            closeDialog();

            if (parentId === 'desktop') {
                renderDesktop();
            } else {
                renderFolderContents(parentId);
            }

            if (type !== 'folder') openDocumentWindow(newItem.id);
        }

        function openCreateShortcutDialog() {
            openDialog('إضافة اختصار تطبيق جديد', `
                <div class="space-y-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">اسم التطبيق</label>
                        <input type="text" id="sc-name" placeholder="مثال: شات جي بي تي" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">الرابط المباشر (URL)</label>
                        <input type="url" id="sc-url" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button onclick="closeDialog()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold">إلغاء</button>
                        <button onclick="confirmCreateShortcut()" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">إضافة لسطح المكتب</button>
                    </div>
                </div>
            `);
        }

        function confirmCreateShortcut() {
            const title = document.getElementById('sc-name').value.trim();
            const url = document.getElementById('sc-url').value.trim();
            if (!title || !url) return;

            userData.customApps.push({
                id: 'shortcut_' + Date.now(),
                title,
                type: 'url',
                url: url.startsWith('http') ? url : 'https://' + url,
                company: 'تطبيق مضاف بواسطة المستخدم',
                desc: 'اختصار مخصص يعمل في نافذة مستقلة',
                icon: 'fa-solid fa-globe',
                bg: 'bg-teal-600',
                isDefault: false
            });
            saveUserData();
            closeDialog();
            renderDesktop();
            renderStartApps();
        }

        // إعادة تسمية وحذف العناصر
        function renameFSItemPrompt(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;
            openDialog('إعادة تسمية', `
                <div class="space-y-4">
                    <input type="text" id="rename-input" value="${item.name}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-orange-500">
                    <div class="flex justify-end gap-2">
                        <button onclick="closeDialog()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold">إلغاء</button>
                        <button onclick="confirmRenameFS('${itemId}')" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">حفظ الاسم</button>
                    </div>
                </div>
            `);
        }

        function confirmRenameFS(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            const newName = document.getElementById('rename-input').value.trim();
            if (!item || !newName) return;
            item.name = newName;
            saveUserData();
            closeDialog();
            renderDesktop();
            if (item.parentId !== 'desktop') renderFolderContents(item.parentId);
        }

        function deleteFSItem(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;
            // حذف العنصر وما بداخله إذا كان مجلداً
            const idsToRemove = new Set([itemId]);
            let added = true;
            while (added) {
                added = false;
                userData.fsItems.forEach(i => {
                    if (idsToRemove.has(i.parentId) && !idsToRemove.has(i.id)) {
                        idsToRemove.add(i.id);
                        added = true;
                    }
                });
            }
            userData.fsItems = userData.fsItems.filter(i => !idsToRemove.has(i.id));
            delete userData.positions[itemId];
            saveUserData();
            closeWindow('folder_' + itemId);
            closeWindow('doc_' + itemId);
            renderDesktop();
            if (item.parentId !== 'desktop') renderFolderContents(item.parentId);
        }

        function deleteCustomApp(appId) {
            const app = getAllApps().find(a => a.id === appId);
            if (!app) return;
            if (app.isDefault) {
                showInfoDialog('تطبيق نظام محمي', `التطبيق "${app.title}" من التطبيقات الافتراضية لنظام Doors ولا يمكن حذفه.`);
                return;
            }
            userData.customApps = userData.customApps.filter(a => a.id !== appId);
            delete userData.positions['app_' + appId];
            saveUserData();
            renderDesktop();
            renderStartApps();
        }

        function showPropertiesDialog(kind, data) {
            if (kind === 'app') {
                openDialog(`خصائص: ${data.title}`, `
                    <div class="space-y-2.5 text-xs">
                        <div class="flex items-center gap-3 pb-3 border-b border-slate-100">
                            <div class="w-12 h-12 ${data.bg} text-white rounded-xl flex items-center justify-center text-xl"><i class="${data.icon}"></i></div>
                            <div>
                                <div class="font-extrabold text-sm">${data.title}</div>
                                <div class="text-slate-500">${data.company || 'Doors Ecosystem'}</div>
                            </div>
                        </div>
                        <div class="flex justify-between"><span class="text-slate-500">الحالة:</span><span class="font-bold ${data.isDefault ? 'text-orange-600' : 'text-emerald-600'}">${data.isDefault ? 'تطبيق نظام افتراضي (محمي من الحذف)' : 'تطبيق خارجي / سحابي (قابل للحذف)'}</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">طريقة التشغيل:</span><span class="font-bold">${data.type.startsWith('iframe') ? 'نافذة نظام داخلية (Iframe)' : 'نافذة تطبيق مستقلة'}</span></div>
                        ${data.url ? `<div class="flex justify-between gap-4"><span class="text-slate-500 shrink-0">الرابط:</span><span class="font-mono text-[11px] truncate text-indigo-600">${data.url}</span></div>` : ''}
                        <div class="pt-2 text-slate-600 bg-slate-50 p-3 rounded-xl">${data.desc || 'لا يوجد وصف إضافي.'}</div>
                    </div>
                `);
            } else {
                const countInside = data.type === 'folder' ? userData.fsItems.filter(i => i.parentId === data.id).length : null;
                openDialog(`خصائص: ${data.name}`, `
                    <div class="space-y-2.5 text-xs">
                        <div class="flex justify-between"><span class="text-slate-500">النوع:</span><span class="font-bold">${data.type === 'folder' ? 'مجلد ملفات' : (data.type === 'note' ? 'ملاحظة سريعة' : 'مستند شخصي')}</span></div>
                        ${countInside !== null ? `<div class="flex justify-between"><span class="text-slate-500">العناصر بداخله:</span><span class="font-bold">${countInside}</span></div>` : `<div class="flex justify-between"><span class="text-slate-500">عدد الأحرف:</span><span class="font-bold">${(data.content || '').length}</span></div>`}
                        <div class="flex justify-between"><span class="text-slate-500">تاريخ الإنشاء:</span><span class="font-bold">${new Date(data.createdAt).toLocaleString('ar-EG')}</span></div>
                    </div>
                `);
            }
        }

        // =========================================================================
        // 8. القائمة المخصصة للزر الأيمن (سطح المكتب الفارغ / تطبيق / ملف أو مجلد)
        // =========================================================================
        function showContextMenu(x, y, targetType, data = null) {
            const menu = document.getElementById('context-menu');
            let html = '';

            if (targetType === 'desktop') {
                html = `
                    <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400">خيارات سطح المكتب</div>
                    <button onclick="hideContextMenu(); createNewItemPrompt('folder', 'desktop')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-folder-plus text-amber-500 w-4"></i> إنشاء مجلد جديد</button>
                    <button onclick="hideContextMenu(); createNewItemPrompt('doc', 'desktop')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-file-circle-plus text-sky-500 w-4"></i> إنشاء مستند شخصي</button>
                    <button onclick="hideContextMenu(); createNewItemPrompt('note', 'desktop')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-note-sticky text-yellow-500 w-4"></i> إنشاء ملاحظة سريعة</button>
                    <button onclick="hideContextMenu(); openCreateShortcutDialog()" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-link text-teal-600 w-4"></i> إضافة اختصار تطبيق</button>
                    <div class="my-1.5 border-t border-slate-100"></div>
                    <button onclick="hideContextMenu(); userData.positions = {}; saveUserData(); renderDesktop();" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-table-cells text-slate-500 w-4"></i> ترتيب الأيقونات</button>
                    <button onclick="hideContextMenu(); renderDesktop();" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-rotate text-slate-500 w-4"></i> تحديث</button>
                    <div class="my-1.5 border-t border-slate-100"></div>
                    <button onclick="hideContextMenu(); openIframeWindow('settings');" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-gear text-slate-700 w-4"></i> إعدادات النظام والمظهر</button>
                `;
            } else if (targetType === 'app') {

                    : `<button onclick="hideContextMenu(); deleteCustomApp('${data.id}')" class="w-full px-3.5 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2.5 font-bold transition"><i class="fa-solid fa-trash w-4"></i> حذف التطبيق</button>`;

                html = `
                    <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 truncate">${data.title}</div>
                    <button onclick="hideContextMenu(); launchApp('${data.id}')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-bold transition"><i class="fa-solid fa-play text-orange-600 w-4"></i> فتح</button>
                    ${isUrl ? `
                    <div class="relative submenu-trigger">
                        <div class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center justify-between font-semibold transition">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-arrow-up-right-from-square text-indigo-500 w-4"></i> فتح باستخدام...</span>
                            <i class="fa-solid fa-chevron-left text-[10px] text-slate-400"></i>
                        </div>
                        <div class="submenu-panel hidden absolute top-0 right-full mr-1 w-52 bg-white/95 backdrop-blur-xl border border-slate-200 rounded-xl shadow-xl py-1.5">
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'default')" class="w-full px-3 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2 font-semibold text-right"><i class="fa-solid fa-window-restore text-orange-500 w-4"></i> نافذة Doors المستقلة</button>
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'newtab')" class="w-full px-3 py-2 hover:bg-slate-100 flex items-center gap-2 font-semibold text-right"><i class="fa-brands fa-chrome text-blue-500 w-4"></i> تبويب كروم عادي</button>
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'iframe_preview')" class="w-full px-3 py-2 hover:bg-slate-100 flex items-center gap-2 font-semibold text-right"><i class="fa-solid fa-code text-slate-500 w-4"></i> معاينة داخلية (Iframe)</button>
                        </div>
                    </div>` : ''}
                    <button onclick="hideContextMenu(); showPropertiesDialog('app', getAllApps().find(a=>a.id==='${data.id}'))" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-circle-info text-slate-500 w-4"></i> خصائص</button>
                    <div class="my-1.5 border-t border-slate-100"></div>
                    ${deleteRow}
                `;
            } else if (targetType === 'fs') {
                html = `
                    <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 truncate">${data.name}</div>
                    <button onclick="hideContextMenu(); openFSItem('${data.id}')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-bold transition"><i class="fa-solid fa-folder-open text-orange-600 w-4"></i> فتح</button>
                    ${data.type !== 'folder' ? `
                    <div class="relative submenu-trigger">
                        <div class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center justify-between font-semibold transition">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-pen-to-square text-sky-500 w-4"></i> فتح باستخدام...</span>
                            <i class="fa-solid fa-chevron-left text-[10px] text-slate-400"></i>
                        </div>
                        <div class="submenu-panel hidden absolute top-0 right-full mr-1 w-48 bg-white/95 backdrop-blur-xl border border-slate-200 rounded-xl shadow-xl py-1.5">
                            <button onclick="hideContextMenu(); openDocumentWindow('${data.id}')" class="w-full px-3 py-2 hover:bg-sky-50 text-sky-700 flex items-center gap-2 font-semibold text-right"><i class="fa-solid fa-file-lines w-4"></i> محرر Doors</button>
                            <button onclick="hideContextMenu(); downloadDocument('${data.id}')" class="w-full px-3 py-2 hover:bg-slate-100 flex items-center gap-2 font-semibold text-right"><i class="fa-solid fa-download w-4"></i> تصدير كملف نصي</button>
                        </div>
                    </div>` : ''}
                    <button onclick="hideContextMenu(); renameFSItemPrompt('${data.id}')" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-i-cursor text-slate-500 w-4"></i> إعادة تسمية</button>
                    <button onclick="hideContextMenu(); showPropertiesDialog('fs', userData.fsItems.find(i=>i.id==='${data.id}'))" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold transition"><i class="fa-solid fa-circle-info text-slate-500 w-4"></i> خصائص</button>
                    <div class="my-1.5 border-t border-slate-100"></div>
                    <button onclick="hideContextMenu(); deleteFSItem('${data.id}')" class="w-full px-3.5 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2.5 font-bold transition"><i class="fa-solid fa-trash w-4"></i> حذف</button>
                `;
            }

            menu.innerHTML = html;
            menu.classList.remove('hidden');

            // منع خروج القائمة خارج حدود الشاشة
            const mw = menu.offsetWidth || 230;
            const mh = menu.offsetHeight || 260;
            const posX = (x + mw > window.innerWidth) ? Math.max(8, x - mw) : x;
            const posY = (y + mh > window.innerHeight - 64) ? Math.max(8, y - mh) : y;
            menu.style.left = posX + 'px';
            menu.style.top = posY + 'px';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.add('hidden');
        }

        // النقر بالزر الأيمن على المساحة الفارغة في سطح المكتب
        document.getElementById('desktop-area').addEventListener('contextmenu', (e) => {
            if (e.target.closest('.desktop-item')) return;
            e.preventDefault();
            selectedItemId = null;
            highlightSelectedDesktopIcon();
            showContextMenu(e.clientX, e.clientY, 'desktop');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#context-menu')) hideContextMenu();
            if (!e.target.closest('#doors-start-menu') && !e.target.closest('#doors-start-btn')) toggleStartMenu(false);
            if (e.target.id === 'desktop-area') {
                selectedItemId = null;
                highlightSelectedDesktopIcon();
            }
        });

        // =========================================================================
        // 9. قائمة Doors والبحث والحوارات
        // =========================================================================
        function toggleStartMenu(forceState) {
            const menu = document.getElementById('doors-start-menu');
            const shouldOpen = forceState !== undefined ? forceState : menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !shouldOpen);
            menu.classList.toggle('flex', shouldOpen);
            if (shouldOpen) {
                document.getElementById('start-search-input').value = '';
                renderStartApps();
            }
        }

        function renderStartApps(filter = '') {
            const grid = document.getElementById('start-apps-grid');
            if (!grid) return;
            const q = filter.trim().toLowerCase();
            const list = getAllApps().filter(a => a.title.toLowerCase().includes(q) || (a.enTitle && a.enTitle.toLowerCase().includes(q)));

            grid.innerHTML = '';
            list.forEach(app => {
                const btn = document.createElement('button');
                btn.className = 'flex flex-col items-center p-2.5 rounded-xl hover:bg-orange-50 transition';
                btn.innerHTML = `
                    <div class="w-10 h-10 ${app.bg} text-white rounded-xl flex items-center justify-center text-base shadow mb-1.5"><i class="${app.icon}"></i></div>
                    <span class="text-[11px] font-bold text-slate-700 truncate w-full text-center">${app.title}</span>
                `;
                btn.onclick = () => {
                    toggleStartMenu(false);
                    launchApp(app.id);
                };
                grid.appendChild(btn);
            });
        }

        function filterStartApps() {
            renderStartApps(document.getElementById('start-search-input').value);
        }

        function toggleZozenSearch() {
            const modal = document.getElementById('zozen-search-modal');
            const opening = modal.classList.contains('hidden');
            modal.classList.toggle('hidden', !opening);
            modal.classList.toggle('flex', opening);
            if (opening) {
                const inp = document.getElementById('zozen-search-input');
                inp.value = '';
                inp.focus();
                executeZozenSearch();
            }
        }

        function executeZozenSearch() {
            const query = document.getElementById('zozen-search-input').value.trim().toLowerCase();
            const res = document.getElementById('zozen-search-results');

            const apps = getAllApps().filter(a => !query || a.title.toLowerCase().includes(query) || (a.enTitle && a.enTitle.toLowerCase().includes(query)));
            const files = (userData?.fsItems || []).filter(f => !query || f.name.toLowerCase().includes(query));

            let html = '';
            apps.forEach(app => {
                html += `
                    <div onclick="toggleZozenSearch(); launchApp('${app.id}')" class="p-3 bg-slate-50 hover:bg-orange-50 border border-slate-200 rounded-xl flex items-center justify-between transition">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 ${app.bg} text-white rounded-lg flex items-center justify-center text-xs"><i class="${app.icon}"></i></div>
                            <div>
                                <div class="font-bold text-slate-800">${app.title}</div>
                                <div class="text-[10px] text-slate-500">${app.company || 'تطبيق Doors'}</div>
                            </div>
                        </div>
                        <span class="bg-orange-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">فتح</span>
                    </div>`;
            });
            files.forEach(item => {
                html += `
                    <div onclick="toggleZozenSearch(); openFSItem('${item.id}')" class="p-3 bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl flex items-center justify-between transition">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 ${item.type === 'folder' ? 'bg-amber-500' : 'bg-sky-500'} text-white rounded-lg flex items-center justify-center text-xs"><i class="fa-solid ${item.type === 'folder' ? 'fa-folder' : 'fa-file-lines'}"></i></div>
                            <div>
                                <div class="font-bold text-slate-800">${item.name}</div>
                                <div class="text-[10px] text-slate-500">${item.type === 'folder' ? 'مجلد' : 'مستند شخصي'}</div>
                            </div>
                        </div>
                        <span class="bg-slate-800 text-white px-3 py-1 rounded-lg text-[10px] font-bold">عرض</span>
                    </div>`;
            });

            res.innerHTML = html || '<div class="text-center py-6 text-slate-400">لا توجد نتائج مطابقة</div>';
        }

        function openDialog(title, bodyHtml) {
            document.getElementById('dialog-title').textContent = title;
            document.getElementById('dialog-body').innerHTML = bodyHtml;
            const d = document.getElementById('system-dialog');
            d.classList.remove('hidden');
            d.classList.add('flex');
        }

        function showInfoDialog(title, message) {
            openDialog(title, `
                <p class="text-slate-600 leading-relaxed mb-4">${message}</p>
                <div class="flex justify-end">
                    <button onclick="closeDialog()" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">حسناً</button>
                </div>
            `);
        }

        function closeDialog() {
            const d = document.getElementById('system-dialog');
            d.classList.add('hidden');
            d.classList.remove('flex');
        }

        // =========================================================================
        // 10. محرك مؤشر الماوس الخاص + الساعة + الإقلاع
        // =========================================================================
        const cursorEl = document.getElementById('doors-cursor');
        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('custom-cursor-active')) return;
            cursorEl.style.opacity = '1';
            cursorEl.style.left = e.clientX + 'px';
            cursorEl.style.top = e.clientY + 'px';

            const interactive = e.target.closest('button, a, input, textarea, .desktop-item, .submenu-trigger');
            cursorEl.classList.toggle('hovering', Boolean(interactive));
        });
        document.addEventListener('mousedown', () => cursorEl.classList.add('clicking'));
        document.addEventListener('mouseup', () => cursorEl.classList.remove('clicking'));
        document.addEventListener('mouseleave', () => cursorEl.style.opacity = '0');

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock-date').textContent = now.toLocaleDateString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // إقلاع النظام وفحص الجلسة المحفوظة
        checkSessionOnBoot();
    </script>
</body>
</html>

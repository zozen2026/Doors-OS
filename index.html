<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors OS - Sovereign Hardware Environment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            user-select: none; 
            overflow: hidden;
        }
        .window { 
            transition: box-shadow 0.2s; 
        }
        .window-maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 3.5rem) !important;
            border-radius: 0 !important;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body id="os-body" class="h-screen w-screen text-white flex flex-col justify-between relative bg-cover bg-center transition-all duration-500" style="background-image: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);">

    <!-- Desktop Icons Grid (الاختصارات على سطح المكتب) -->
    <div class="p-6 grid grid-cols-4 sm:grid-cols-6 gap-5 w-fit z-0">
        <!-- 1. Zozen -->
        <div onclick="openApp('zozen')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-orange-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-orange-400/30">
                <i class="fa-solid fa-bolt text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Zozen</span>
        </div>

        <!-- 2. Zozen Store -->
        <div onclick="openApp('store')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-indigo-400/30">
                <i class="fa-solid fa-store text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Zozen Store</span>
        </div>

        <!-- 3. System Installer Hub -->
        <div onclick="openApp('installer')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-orange-300/40 animate-pulse">
                <i class="fa-solid fa-compact-disc text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-orange-400 font-bold drop-shadow">Get Doors OS</span>
        </div>

        <!-- 4. Browser Hub -->
        <div onclick="openApp('browser')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-amber-300/30">
                <i class="fa-brands fa-chrome text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Browser Hub</span>
        </div>

        <!-- 5. Google Gemini -->
        <div onclick="openApp('gemini')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-blue-400/30" style="background: linear-gradient(135deg, #1a73e8 0%, #8ab4f8 50%, #c5221f 100%);">
                <i class="fa-solid fa-wand-magic-sparkles text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Gemini</span>
        </div>

        <!-- 6. Telegram -->
        <div onclick="openApp('telegram')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-sky-300/30">
                <i class="fa-brands fa-telegram text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Telegram</span>
        </div>

        <!-- 7. YouTube (اختصار يعمل داخل النافذة كبرنامج مستقل) -->
        <div onclick="openApp('youtube')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-red-400/30">
                <i class="fa-brands fa-youtube text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">YouTube</span>
        </div>

        <!-- 8. Facebook -->
        <div onclick="openApp('facebook')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-blue-400/30">
                <i class="fa-brands fa-facebook-f text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Facebook</span>
        </div>

        <!-- 9. TikTok -->
        <div onclick="openApp('tiktok')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-black rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-zinc-700">
                <i class="fa-brands fa-tiktok text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">TikTok</span>
        </div>

        <!-- 10. Instagram -->
        <div onclick="openApp('instagram')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 via-rose-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-pink-400/30">
                <i class="fa-brands fa-instagram text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Instagram</span>
        </div>

        <!-- 11. WhatsApp -->
        <div onclick="openApp('whatsapp')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-emerald-400/30">
                <i class="fa-brands fa-whatsapp text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">WhatsApp</span>
        </div>

        <!-- 12. Settings -->
        <div onclick="openApp('settings')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-slate-700 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-slate-500/30">
                <i class="fa-solid fa-gear text-2xl text-slate-200"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Settings</span>
        </div>
    </div>

    <!-- Windows Container -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Right-Click Context Menu -->
    <div id="context-menu" class="absolute hidden w-52 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl p-1.5 z-50 text-slate-200 text-xs">
        <button onclick="refreshDesktop()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-rotate"></i> Refresh System
        </button>
        <button onclick="changeWallpaper()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-image"></i> Change Wallpaper
        </button>
    </div>

    <!-- Taskbar -->
    <div class="h-14 bg-slate-900/80 backdrop-blur-md border-t border-slate-800 px-4 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
            <button onclick="toggleStartMenu()" class="h-10 px-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold flex items-center gap-2 shadow-lg transition border border-orange-400/30 text-white">
                <i class="fa-solid fa-door-open text-lg"></i>
                <span>Doors</span>
            </button>
            <div id="taskbar-apps" class="flex items-center gap-1 border-l border-slate-700 pl-3 overflow-x-auto"></div>
        </div>
        <div class="flex items-center gap-4 text-xs text-slate-300 font-medium">
            <span id="clock" class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">00:00</span>
        </div>
    </div>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        const contextMenu = document.getElementById('context-menu');
        window.addEventListener('click', () => contextMenu.classList.add('hidden'));
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            contextMenu.style.top = `${e.clientY}px`;
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.classList.remove('hidden');
        });

        function refreshDesktop() { location.reload(); }

        const wallpapers = [
            "radial-gradient(circle at center, #1e293b 0%, #090d16 100%)",
            "radial-gradient(circle at center, #3b1e29 0%, #160909 100%)"
        ];
        let currentWp = 0;
        function changeWallpaper() {
            currentWp = (currentWp + 1) % wallpapers.length;
            document.getElementById('os-body').style.backgroundImage = wallpapers[currentWp];
        }

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            if(menu) { menu.classList.toggle('hidden'); menu.classList.toggle('flex'); }
        }

        window.zIndexCounter = 10;

        // إعدادات التطبيقات والاختصارات (تفتح داخل نظامك كالنوافذ المستقلة)
        const appData = {
            'zozen': { title: 'Zozen App', icon: 'fa-bolt text-orange-400', url: 'https://zozen.vercel.app', mode: 'internal' },
            'store': { title: 'Zozen Store', icon: 'fa-store text-indigo-400', url: 'https://zozen2026.github.io/Zozen-store/', mode: 'internal' },
            'installer': { title: 'Doors OS Installer', icon: 'fa-compact-disc text-orange-400', mode: 'installer' },
            'browser': { title: 'Browser Hub', icon: 'fa-chrome text-amber-400', url: 'https://www.google.com', mode: 'browser' },
            'gemini': { title: 'Google Gemini', icon: 'fa-wand-magic-sparkles text-blue-400', url: 'https://gemini.google.com', mode: 'internal' },
            'telegram': { title: 'Telegram Web', icon: 'fa-telegram text-sky-400', url: 'https://web.telegram.org', mode: 'internal' },
            'youtube': { title: 'YouTube', icon: 'fa-youtube text-red-500', url: 'https://www.youtube.com/embed?autoplay=1', mode: 'internal' },
            'facebook': { title: 'Facebook', icon: 'fa-facebook-f text-blue-500', url: 'https://www.facebook.com', mode: 'internal' },
            'tiktok': { title: 'TikTok', icon: 'fa-tiktok text-white', url: 'https://www.tiktok.com', mode: 'internal' },
            'instagram': { title: 'Instagram', icon: 'fa-instagram text-pink-500', url: 'https://www.instagram.com', mode: 'internal' },
            'whatsapp': { title: 'WhatsApp Web', icon: 'fa-whatsapp text-emerald-500', url: 'https://web.whatsapp.com', mode: 'internal' },
            'settings': { title: 'System Settings', icon: 'fa-gear text-slate-300', mode: 'settings' }
        };

        function openApp(appKey) {
            const app = appData[appKey];
            if (app.mode === 'installer') { createInstallerWindow(appKey, app); return; }
            if (app.mode === 'settings') { createSettingsWindow(appKey, app); return; }

            const existingWin = document.getElementById(`win-${appKey}`);
            if (existingWin) {
                if (existingWin.style.display === 'none') existingWin.style.display = 'flex';
                bringToFront(existingWin);
                return;
            }

            const winDiv = document.createElement('div');
            winDiv.id = `win-${appKey}`;
            winDiv.className = 'window absolute top-16 left-20 w-[950px] h-[620px] bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden';
            winDiv.onclick = () => bringToFront(winDiv);

            let browserToolbar = '';
            if (app.mode === 'browser') {
                browserToolbar = `
                    <div class="h-9 bg-slate-900 border-b border-slate-800 px-3 flex items-center gap-2">
                        <input type="text" value="${app.url}" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1 text-xs text-slate-200 focus:outline-none" readonly>
                    </div>
                `;
            }

            winDiv.innerHTML = `
                <div class="h-11 bg-slate-800/90 border-b border-slate-700/80 px-4 flex items-center justify-between cursor-move" onmousedown="startDrag(event, '${winDiv.id}')">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${app.icon}"></i>
                        <span class="font-bold text-sm text-slate-200">${app.title}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="minimizeWindow('${winDiv.id}')" class="w-6 h-6 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fa-solid fa-minus text-xs"></i></button>
                        <button onclick="toggleMaximize('${winDiv.id}')" class="w-6 h-6 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fa-regular fa-square text-xs"></i></button>
                        <button onclick="closeWindow('${winDiv.id}', '${appKey}')" class="w-6 h-6 rounded-lg bg-red-500/20 hover:bg-red-600 flex items-center justify-center text-red-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>
                </div>
                ${browserToolbar}
                <div class="flex-1 bg-slate-950 relative">
                    <iframe src="${app.url}" class="w-full h-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            `;

            document.getElementById('windows-container').appendChild(winDiv);
            bringToFront(winDiv);
            addTaskbarIcon(appKey);
        }

        function createInstallerWindow(appKey, app) {
            const winDiv = document.createElement('div');
            winDiv.id = `win-${appKey}`;
            winDiv.className = 'window absolute top-14 left-24 w-[500px] h-[300px] bg-slate-900 border border-orange-500/30 rounded-2xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden';
            winDiv.innerHTML = `
                <div class="h-11 bg-slate-800 px-4 flex items-center justify-between cursor-move" onmousedown="startDrag(event, '${winDiv.id}')">
                    <span class="font-bold text-sm text-white">${app.title}</span>
                    <button onclick="closeWindow('${winDiv.id}', '${appKey}')" class="text-red-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-6 text-center text-xs text-slate-300">Doors OS Hardware Installer Hub - Ready for Deployment.</div>
            `;
            document.getElementById('windows-container').appendChild(winDiv);
            bringToFront(winDiv);
            addTaskbarIcon(appKey);
        }

        function createSettingsWindow(appKey, app) {
            const winDiv = document.createElement('div');
            winDiv.id = `win-${appKey}`;
            winDiv.className = 'window absolute top-20 left-32 w-[400px] h-[300px] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden';
            winDiv.innerHTML = `
                <div class="h-11 bg-slate-800 px-4 flex items-center justify-between cursor-move" onmousedown="startDrag(event, '${winDiv.id}')">
                    <span class="font-bold text-sm text-white">${app.title}</span>
                    <button onclick="closeWindow('${winDiv.id}', '${appKey}')" class="text-red-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-6 text-xs text-slate-300">System Version: Doors OS 6.3 Sovereign</div>
            `;
            document.getElementById('windows-container').appendChild(winDiv);
            bringToFront(winDiv);
            addTaskbarIcon(appKey);
        }

        function bringToFront(win) { window.zIndexCounter += 1; win.style.zIndex = window.zIndexCounter; }
        function minimizeWindow(winId) { document.getElementById(winId).style.display = 'none'; }
        function toggleMaximize(winId) { document.getElementById(winId).classList.toggle('window-maximized'); }
        function closeWindow(winId, appKey) { const win = document.getElementById(winId); if (win) win.remove(); removeTaskbarIcon(appKey); }

        function addTaskbarIcon(appKey) {
            const container = document.getElementById('taskbar-apps');
            if (document.getElementById(`tb-${appKey}`)) return;
            const app = appData[appKey];
            const btn = document.createElement('button');
            btn.id = `tb-${appKey}`;
            btn.onclick = () => {
                const win = document.getElementById(`win-${appKey}`);
                if (win) { win.style.display = win.style.display === 'none' ? 'flex' : 'none'; bringToFront(win); }
            };
            btn.className = 'h-9 px-3 bg-slate-800/60 hover:bg-slate-700/80 rounded-lg text-slate-200 text-xs flex items-center gap-2 border border-slate-700/50 transition';
            btn.innerHTML = `<i class="fa-solid ${app.icon}"></i> <span>${app.title}</span>`;
            container.appendChild(btn);
        }

        function removeTaskbarIcon(appKey) { const btn = document.getElementById(`tb-${appKey}`); if (btn) btn.remove(); }

        let activeDragWin = null, dragOffsetX = 0, dragOffsetY = 0;
        function startDrag(e, winId) {
            activeDragWin = document.getElementById(winId);
            dragOffsetX = e.clientX - activeDragWin.offsetLeft;
            dragOffsetY = e.clientY - activeDragWin.offsetTop;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }
        function onDrag(e) {
            if (!activeDragWin || activeDragWin.classList.contains('window-maximized')) return;
            activeDragWin.style.left = `${e.clientX - dragOffsetX}px`;
            activeDragWin.style.top = `${e.clientY - dragOffsetY}px`;
        }
        function stopDrag() {
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            activeDragWin = null;
        }
    </script>
</body>
</html>

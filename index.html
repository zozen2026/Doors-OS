<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">

    <!-- Supabase & Tailwind & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;700&display=swap');

        :root {
            --doors-accent: #ea580c;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            transition: background 0.4s ease;
        }

        /* تفعيل المؤشر الخاص وإخفاء مؤشر النظام التقليدي */
        body.custom-cursor-active,
        body.custom-cursor-active * {
            cursor: none !important;
        }

        /* تصميم مؤشر Doors الخاص */
        #doors-cursor {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-3px, -3px);
            transition: opacity 0.15s ease, transform 0.05s linear;
            will-change: left, top;
        }

        #doors-cursor .cursor-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 22px;
            height: 22px;
            border: 1.5px solid rgba(234, 88, 12, 0.45);
            border-radius: 50%;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        #doors-cursor.hovering .cursor-ring {
            transform: scale(1.45);
            border-color: rgba(234, 88, 12, 0.9);
            background: rgba(234, 88, 12, 0.12);
        }

        #doors-cursor.clicking svg {
            transform: scale(0.86);
        }

        /* عناصر سطح المكتب */
        .desktop-item {
            position: absolute;
            width: 92px;
            padding: 8px 4px;
            border-radius: 14px;
            transition: background 0.15s ease, box-shadow 0.15s ease;
            touch-action: none;
        }

        .desktop-item:hover {
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(6px);
        }

        .desktop-item.selected {
            background: rgba(234, 88, 12, 0.18);
            box-shadow: inset 0 0 0 1.5px rgba(234, 88, 12, 0.65);
        }

        /* النوافذ */
        .os-window {
            position: absolute;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.35);
            display: flex;
            flex-direction: column;
            min-width: 380px;
            min-height: 280px;
            resize: both;
        }

        .os-window.maximized {
            top: 8px !important;
            left: 8px !important;
            width: calc(100vw - 16px) !important;
            height: calc(100vh - 76px) !important;
            resize: none;
        }

        .dragging-window iframe {
            pointer-events: none !important;
        }

        /* القائمة المنبثقة بالزر الأيمن */
        .context-menu {
            position: fixed;
            min-width: 225px;
            z-index: 99990;
            animation: popIn 0.12s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .submenu-trigger:hover .submenu-panel {
            display: block;
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.6); border-radius: 10px; }
    </style>
</head>

        // =========================================================================
        // 2. نظام الحسابات وحفظ الجلسة الدائم (LocalStorage Session)
        // =========================================================================
        function getAccountsDB() {
            return JSON.parse(localStorage.getItem('doors_accounts_db_v2')) || {};
        }

        function saveAccountsDB(db) {
            localStorage.setItem('doors_accounts_db_v2', JSON.stringify(db));
        }

        function createDefaultUserData(account) {
            return {
                customApps: [],
                fsItems: [
                    {
                        id: 'folder_personal_init',
                        parentId: 'desktop',
                        type: 'folder',
                        name: 'ملفاتي الشخصية',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 'doc_welcome_init',
                        parentId: 'desktop',
                        type: 'doc',
                        name: 'ملاحظات Doors.doc',
                        content: 'مرحباً بك في نظام Doors OS v2.0!\n\n- يمكنك الضغط بالزر الأيمن في أي مكان فارغ لإنشاء مجلدات أو مستندات شخصية.\n- يتم حفظ جلستك وملفاتك تلقائياً بحسابك.\n- التطبيقات الافتراضية السبعة محمية من الحذف.',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }
                ],
                positions: {},
                settings: {
                    wallpaper: 'sovereign',
                    customWallpaperUrl: '',
                    customCursor: true
                }
            };
        }

        function loadUserData(username) {
            const key = 'doors_userdata_v2_' + username;
            const stored = localStorage.getItem(key);
            if (stored) {
                return JSON.parse(stored);
            }
            const fresh = createDefaultUserData(username);
            localStorage.setItem(key, JSON.stringify(fresh));
            return fresh;
        }

        function saveUserData() {
            if (!currentUser || !userData) return;
            localStorage.setItem('doors_userdata_v2_' + currentUser.username, JSON.stringify(userData));
        }

        function checkSessionOnBoot() {
            const savedSession = localStorage.getItem('doors_active_session_v2') || sessionStorage.getItem('doors_active_session_v2');
            const db = getAccountsDB();

            if (savedSession && db[savedSession]) {
                startUserSession(db[savedSession], true);
            } else {
                showAuthScreen();
            }
        }

        function showAuthScreen() {
            const authEl = document.getElementById('auth-screen');
            authEl.classList.remove('hidden');
            authEl.classList.add('flex');
            renderSavedAccountsList();
        }

        function renderSavedAccountsList() {
            const db = getAccountsDB();
            const keys = Object.keys(db);
            const box = document.getElementById('saved-accounts-box');
            const list = document.getElementById('saved-accounts-list');
            if (keys.length === 0) {
                box.classList.add('hidden');
                return;
            }
            box.classList.remove('hidden');
            list.innerHTML = '';
            keys.forEach(u => {
                const acc = db[u];
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'flex items-center gap-2 bg-slate-100 hover:bg-orange-50 border border-slate-200 hover:border-orange-300 px-3 py-1.5 rounded-xl text-xs font-bold transition';
                btn.innerHTML = `<span class="w-5 h-5 rounded-md bg-orange-600 text-white text-[10px] flex items-center justify-center">${(acc.fullname || u)[0].toUpperCase()}</span><span>${acc.fullname}</span>`;
                btn.onclick = () => {
                    switchAuthTab('login');
                    document.getElementById('login-username').value = u;
                    document.getElementById('login-password').focus();
                };
                list.appendChild(btn);
            });
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('reg-error').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = 'py-2 rounded-lg bg-white text-orange-600 shadow-sm transition';
                tabReg.className = 'py-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.className = 'py-2 rounded-lg bg-white text-orange-600 shadow-sm transition';
                tabLogin.className = 'py-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const fullname = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');

            if (!fullname || !username || password.length < 4) {
                errEl.textContent = 'يرجى تعبئة جميع الحقول بشكل صحيح.';
                errEl.classList.remove('hidden');
                return;
            }

            const db = getAccountsDB();
            if (db[username]) {
                errEl.textContent = 'اسم المستخدم هذا مستخدم مسبقاً، اختر اسماً آخر.';
                errEl.classList.remove('hidden');
                return;
            }

            const newAcc = {
                username,
                fullname,
                password,
                createdAt: new Date().toISOString()
            };
            db[username] = newAcc;
            saveAccountsDB(db);

            // حفظ الجلسة تلقائياً بعد الإنشاء
            startUserSession(newAcc, true);
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('login-remember').checked;
            const errEl = document.getElementById('login-error');

            const db = getAccountsDB();
            const acc = db[username];

            if (!acc || acc.password !== password) {
                errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
                errEl.classList.remove('hidden');
                return;
            }

            startUserSession(acc, remember);
        }

        function startUserSession(account, persist) {
            currentUser = account;
            userData = loadUserData(account.username);

            if (persist) {
                localStorage.setItem('doors_active_session_v2', account.username);
            } else {
                sessionStorage.setItem('doors_active_session_v2', account.username);
            }

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('flex');

            updateAccountUI();
            applySystemSettings();
            renderDesktop();
            renderStartApps();
        }

        function logoutSession() {
            localStorage.removeItem('doors_active_session_v2');
            sessionStorage.removeItem('doors_active_session_v2');
            // إغلاق كل النوافذ المفتوحة
            Object.keys(openWindows).forEach(id => closeWindow(id));
            toggleStartMenu(false);
            currentUser = null;
            userData = null;
            document.getElementById('login-password').value = '';
            showAuthScreen();
        }

        function updateAccountUI() {
            if (!currentUser) return;
            const initial = (currentUser.fullname || currentUser.username)[0].toUpperCase();
            document.getElementById('start-user-name').textContent = currentUser.fullname;
            document.getElementById('start-user-avatar').textContent = initial;
            document.getElementById('taskbar-user-name').textContent = currentUser.fullname;
            document.getElementById('taskbar-user-dot').textContent = initial;
        }

        function applySystemSettings() {
            if (!userData) return;
            const s = userData.settings;
            const body = document.body;

            if (s.customWallpaperUrl) {
                body.style.background = `url('${s.customWallpaperUrl}') center/cover no-repeat`;
            } else {
                const wp = WALLPAPERS[s.wallpaper] || WALLPAPERS.sovereign;
                body.style.background = wp.css;
            }

            if (s.customCursor !== false) {
                body.classList.add('custom-cursor-active');
                document.getElementById('doors-cursor').style.display = 'block';
            } else {
                body.classList.remove('custom-cursor-active');
                document.getElementById('doors-cursor').style.display = 'none';
            }
            renderDesktop();
        }

        // =========================================================================
        // 3. إدارة التطبيقات والملفات والمجلدات والمستندات
        // =========================================================================
        function getAllApps() {
            const custom = (userData && userData.customApps) ? userData.customApps : [];
            return [...DEFAULT_APPS, ...custom];
        }

        function getDesktopFSItems() {
            if (!userData || !userData.fsItems) return [];
            return userData.fsItems.filter(item => item.parentId === 'desktop');
        }

        function isWallpaperDark() {
            if (!userData) return false;
            if (userData.settings.customWallpaperUrl) return true;
            const wp = WALLPAPERS[userData.settings.wallpaper] || WALLPAPERS.sovereign;
            return !wp.textDark;
        }

        function renderDesktop() {
            if (!userData) return;
            const area = document.getElementById('desktop-area');
            area.innerHTML = '';

            const apps = getAllApps();
            const fsItems = getDesktopFSItems();
            const allDesktopEntities = [
                ...apps.map(a => ({ kind: 'app', data: a, id: 'app_' + a.id })),
                ...fsItems.map(f => ({ kind: 'fs', data: f, id: f.id }))
            ];

            const darkText = !isWallpaperDark();
            const labelClass = darkText
                ? 'text-slate-800 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]'
                : 'text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.85)]';

            const maxRows = Math.max(4, Math.floor((window.innerHeight - 100) / 108));

            allDesktopEntities.forEach((entity, index) => {
                const pos = userData.positions[entity.id] || {
                    x: 24 + (Math.floor(index / maxRows) * 102),
                    y: 22 + ((index % maxRows) * 106)
                };

                const div = document.createElement('div');
                div.className = `desktop-item flex flex-col items-center group ${selectedItemId === entity.id ? 'selected' : ''}`;
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';
                div.dataset.entityId = entity.id;

                if (entity.kind === 'app') {
                    const app = entity.data;
                    div.innerHTML = `
                        <div class="w-14 h-14 ${app.bg || 'bg-orange-600'} rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition relative">
                            <i class="${app.icon || 'fa-solid fa-cube'}"></i>
                            ${app.isDefault ? '' : '<span class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full text-[8px] flex items-center justify-center"><i class="fa-solid fa-cloud"></i></span>'}
                        </div>
                        <span class="text-[11px] font-bold text-center leading-tight line-clamp-2 px-1 ${labelClass}">${app.title}</span>
                    `;
                } else {
                    const item = entity.data;
                    let iconHtml = '';
                    if (item.type === 'folder') {
                        iconHtml = `<div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-folder"></i></div>`;
                    } else if (item.type === 'note') {
                        iconHtml = `<div class="w-14 h-14 bg-gradient-to-br from-yellow-300 to-amber-400 rounded-2xl flex items-center justify-center text-amber-900 text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-note-sticky"></i></div>`;
                    } else {
                        iconHtml = `<div class="w-14 h-14 bg-gradient-to-br from-sky-500 to-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-file-lines"></i></div>`;
                    }
                    div.innerHTML = `
                        ${iconHtml}
                        <span class="text-[11px] font-bold text-center leading-tight line-clamp-2 px-1 ${labelClass}">${item.name}</span>
                    `;
                }

                // السحب والإفلات + الفتح بالنقر
                enableDesktopIconDrag(div, entity);

                // القائمة المخصصة بالزر الأيمن على العنصر
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    selectedItemId = entity.id;
                    highlightSelectedDesktopIcon();
                    showContextMenu(e.clientX, e.clientY, entity.kind, entity.data);
                });

                area.appendChild(div);
            });
        }

        function highlightSelectedDesktopIcon() {
            document.querySelectorAll('.desktop-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.entityId === selectedItemId);
            });
        }

        function enableDesktopIconDrag(el, entity) {
            let startX, startY, origX, origY, moved = false;

            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.stopPropagation();
                hideContextMenu();
                toggleStartMenu(false);

                selectedItemId = entity.id;
                highlightSelectedDesktopIcon();

                startX = e.clientX;
                startY = e.clientY;
                origX = parseInt(el.style.left, 10) || 0;
                origY = parseInt(el.style.top, 10) || 0;
                moved = false;

                function onMove(ev) {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
                    if (moved) {
                        const nx = Math.max(8, Math.min(window.innerWidth - 100, origX + dx));
                        const ny = Math.max(8, Math.min(window.innerHeight - 165, origY + dy));
                        el.style.left = nx + 'px';
                        el.style.top = ny + 'px';
                    }
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (moved) {
                        userData.positions[entity.id] = {
                            x: parseInt(el.style.left, 10),
                            y: parseInt(el.style.top, 10)
                        };
                        saveUserData();
                    } else {
                        // نقرة واحدة للفتح السلس
                        if (entity.kind === 'app') {
                            launchApp(entity.data.id);
                        } else {
                            openFSItem(entity.data.id);
                        }
                    }
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // =========================================================================
        // 4. تشغيل التطبيقات: الإعدادات والمتجر عبر Iframe، والباقي نوافذ مستقلة (Chromeless)
        // =========================================================================
        function launchApp(appId, mode = 'default') {
            const app = getAllApps().find(a => a.id === appId);
            if (!app) return;

            if (app.type === 'iframe_store') {
                openIframeWindow('store');
                return;
            }
            if (app.type === 'iframe_settings') {
                openIframeWindow('settings');
                return;
            }

            if (mode === 'newtab') {
                window.open(app.url, '_blank');
                return;
            }

            if (mode === 'iframe_preview') {
                openGenericIframePreview(app);
                return;
            }

            // فتح التطبيق في نافذة كروم مستقلة تماماً (بدون أشرطة متصفح وكأنه تطبيق نظام مستقل)
            const width = Math.min(1180, window.screen.availWidth - 70);
            const height = Math.min(760, window.screen.availHeight - 70);
            const left = Math.round((window.screen.availWidth - width) / 2);
            const top = Math.round((window.screen.availHeight - height) / 2);

            const windowFeatures = [
                'popup=yes',
                `width=${width}`,
                `height=${height}`,
                `left=${left}`,
                `top=${top}`,
                'toolbar=no',
                'menubar=no',
                'location=no',
                'directories=no',
                'status=no',
                'scrollbars=yes',
                'resizable=yes'
            ].join(',');

            const winName = 'DoorsStandalone_' + app.id;
            const openedWin = window.open(app.url, winName, windowFeatures);
            if (openedWin) {
                openedWin.focus();
            } else {
                showInfoDialog('تنبيه النوافذ المنبثقة', 'يرجى السماح بالنوافذ المنبثقة (Popups) في المتصفح ليتم تشغيل التطبيق في نافذة مستقلة خاصة بـ Doors.');
            }
        }

        // =========================================================================
        // 5. نظام النوافذ الداخلية (Draggable / Maximizable)
        // =========================================================================
        function createOSWindow({ id, title, icon, iconBg, width = 820, height = 560, contentHtml }) {
            if (openWindows[id]) {
                focusWindow(id);
                openWindows[id].el.classList.remove('hidden');
                return openWindows[id].el;
            }

            const win = document.createElement('div');
            win.id = 'win_' + id;
            win.className = 'os-window pointer-events-auto bg-white/95 backdrop-blur-2xl border border-slate-200/90';

            const w = Math.min(width, window.innerWidth - 40);
            const h = Math.min(height, window.innerHeight - 100);
            const offset = (Object.keys(openWindows).length % 5) * 26;
            win.style.width = w + 'px';
            win.style.height = h + 'px';
            win.style.left = Math.max(20, (window.innerWidth - w) / 2 + offset) + 'px';
            win.style.top = Math.max(16, (window.innerHeight - h - 70) / 2 + offset) + 'px';
            win.style.zIndex = ++topZIndex;

            win.innerHTML = `
                <div class="win-header h-11 bg-slate-100/95 border-b border-slate-200 px-3.5 flex items-center justify-between shrink-0 select-none" dir="rtl">
                    <div class="flex items-center gap-2.5">
                        <div class="w-6 h-6 ${iconBg || 'bg-orange-600'} text-white rounded-lg flex items-center justify-center text-xs shadow-sm">
                            <i class="${icon || 'fa-solid fa-window-maximize'}"></i>
                        </div>
                        <span class="font-bold text-xs text-slate-800 win-title-text">${title}</span>
                    </div>
                    <div class="flex items-center gap-1.5" dir="ltr">
                        <button onclick="minimizeWindow('${id}')" class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs transition" title="تصغير"><i class="fa-solid fa-minus"></i></button>
                        <button onclick="toggleMaximizeWindow('${id}')" class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs transition" title="تكبير"><i class="fa-regular fa-square"></i></button>
                        <button onclick="closeWindow('${id}')" class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white flex items-center justify-center text-xs transition" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="win-body flex-1 w-full h-full overflow-hidden relative bg-white">${contentHtml}</div>
            `;

            win.addEventListener('mousedown', () => focusWindow(id));

            // سحب النافذة من الشريط العلوي
            const header = win.querySelector('.win-header');
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('button') || win.classList.contains('maximized')) return;
                focusWindow(id);
                document.body.classList.add('dragging-window');
                const startX = e.clientX;
                const startY = e.clientY;
                const origL = win.offsetLeft;
                const origT = win.offsetTop;

                function onMove(ev) {
                    win.style.left = Math.max(-win.offsetWidth + 120, origL + (ev.clientX - startX)) + 'px';
                    win.style.top = Math.max(0, Math.min(window.innerHeight - 105, origT + (ev.clientY - startY))) + 'px';
                }
                function onUp() {
                    document.body.classList.remove('dragging-window');
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            document.getElementById('windows-layer').appendChild(win);
            openWindows[id] = { el: win, title, icon, iconBg };
            renderTaskbarWindows();
            return win;
        }

        function focusWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].el.style.zIndex = ++topZIndex;
            openWindows[id].el.classList.remove('hidden');
            renderTaskbarWindows();
        }

        function minimizeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].el.classList.add('hidden');
            renderTaskbarWindows();
        }

        function toggleMaximizeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].el.classList.toggle('maximized');
        }

        function closeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].el.remove();
            delete openWindows[id];
            renderTaskbarWindows();
        }

        function renderTaskbarWindows() {
            const container = document.getElementById('taskbar-windows');
            container.innerHTML = '';
            Object.entries(openWindows).forEach(([id, info]) => {
                const isHidden = info.el.classList.contains('hidden');
                const btn = document.createElement('button');
                btn.className = `h-9 px-3 rounded-xl border text-xs font-bold flex items-center gap-2 transition shrink-0 ${isHidden ? 'bg-slate-100 border-slate-200 text-slate-600' : 'bg-orange-50 border-orange-300 text-orange-700 shadow-sm'}`;
                btn.innerHTML = `<i class="${info.icon}"></i><span class="max-w-[110px] truncate">${info.title}</span>`;
                btn.onclick = () => {
                    if (isHidden) focusWindow(id);
                    else minimizeWindow(id);
                };
                container.appendChild(btn);
            });
        }

        // =========================================================================
        // 6. نوافذ Iframe المستقلة (الإعدادات + متجر زوزين)
        // =========================================================================
        function getIframeCustomCursorCode() {
            const enabled = userData?.settings?.customCursor !== false;
            if (!enabled) return '';
            return `
                <style>
                    *, *::before, *::after { cursor: none !important; }
                    #inner-cursor { position: fixed; top:0; left:0; pointer-events:none; z-index:999999; transform: translate(-3px,-3px); opacity:0; transition: opacity .12s; }
                </style>
                <div id="inner-cursor">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.28));">
                        <path d="M4 3L19.5 11.2L12.5 13.3L9.8 20.5L4 3Z" fill="#0f172a" stroke="#ea580c" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="9.2" cy="9.2" r="1.5" fill="#fb923c"/>
                    </svg>
                </div>
                <script>
                    const ic = document.getElementById('inner-cursor');
                    document.addEventListener('mousemove', e => {
                        ic.style.opacity = '1';
                        ic.style.left = e.clientX + 'px';
                        ic.style.top = e.clientY + 'px';
                    });
                    document.addEventListener('mouseleave', () => ic.style.opacity = '0');
                <\/script>
            `;
        }

        function openIframeWindow(type) {
            if (type === 'settings') {
                const winId = 'app_settings_iframe';
                if (openWindows[winId]) {
                    focusWindow(winId);
                    return;
                }
                const win = createOSWindow({
                    id: winId,
                    title: 'إعدادات نظام Doors',
                    icon: 'fa-solid fa-gear',
                    iconBg: 'bg-slate-700',
                    width: 820,
                    height: 560,
                    contentHtml: `<iframe id="iframe-settings" class="w-full h-full border-0"></iframe>`
                });
                const iframe = win.querySelector('#iframe-settings');
                iframe.srcdoc = buildSettingsIframeHTML();
                attachIframeMouseBridge(iframe);
            } else if (type === 'store') {
                const winId = 'app_store_iframe';
                if (openWindows[winId]) {
                    focusWindow(winId);
                    return;
                }
                const win = createOSWindow({
                    id: winId,
                    title: 'Zozen Store - متجر النظام السحابي',
                    icon: 'fa-solid fa-store',
                    iconBg: 'bg-indigo-600',
                    width: 920,
                    height: 600,
                    contentHtml: `<iframe id="iframe-store" class="w-full h-full border-0"></iframe>`
                });
                const iframe = win.querySelector('#iframe-store');
                iframe.srcdoc = buildStoreIframeHTML();
                attachIframeMouseBridge(iframe);
            }
        }

        function openGenericIframePreview(app) {
            const winId = 'preview_' + app.id;
            const win = createOSWindow({
                id: winId,
                title: `${app.title} (عرض داخلي)`,
                icon: app.icon,
                iconBg: app.bg,
                width: 940,
                height: 600,
                contentHtml: `
                    <div class="w-full h-full flex flex-col">
                        <div dir="rtl" class="px-3 py-1.5 bg-amber-50 border-b border-amber-200 text-[11px] text-amber-800 flex items-center justify-between">
                            <span>بعض المواقع العالمية تمنع العرض داخل Iframe لأسباب أمنية.</span>
                            <button onclick="launchApp('${app.id}')" class="bg-orange-600 text-white px-2.5 py-1 rounded-lg font-bold">فتح في نافذة مستقلة</button>
                        </div>
                        <iframe src="${app.url}" class="flex-1 w-full border-0"></iframe>
                    </div>
                `
            });
            attachIframeMouseBridge(win.querySelector('iframe'));
        }

        function attachIframeMouseBridge(iframe) {
            if (!iframe) return;
            iframe.addEventListener('mouseenter', () => {
                document.getElementById('doors-cursor').style.opacity = '0';
            });
        }

        // بناء HTML مستقل تماماً لنافذة الإعدادات داخل Iframe
        function buildSettingsIframeHTML() {
            const wpCards = Object.entries(WALLPAPERS).map(([key, wp]) => `

            return `<!DOCTYPE html>

            <body class="h-screen flex overflow-hidden">

                            <div>
                                <div class="font-extrabold text-sm">Doors Settings</div>
                                <div class="text-[10px] text-slate-400">الإصدار 2.0 المستقل</div>
                            </div>
                        </div>
                        <nav class="space-y-1 text-xs font-bold">
                            <button onclick="showSection('account')" id="nav-account" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl bg-orange-50 text-orange-600 transition"><i class="fa-solid fa-user-shield w-4"></i> الحساب والجلسة</button>
                            <button onclick="showSection('appearance')" id="nav-appearance" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition"><i class="fa-solid fa-palette w-4"></i> المظهر والمؤشر</button>
                            <button onclick="showSection('storage')" id="nav-storage" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition"><i class="fa-solid fa-hard-drive w-4"></i> التخزين والنظام</button>
                        </nav>
                    </div>
                    <button onclick="sendMsg('logout')" class="w-full py-2.5 rounded-xl bg-red-50 hover:bg-red-600 text-red-600 hover:text-white text-xs font-bold transition">
                        <i class="fa-solid fa-right-from-bracket ml-1"></i> تسجيل الخروج
                    </button>
                </aside>

                <!-- محتوى الإعدادات -->
                <main class="flex-1 p-6 overflow-y-auto">
                    <!-- قسم الحساب -->
                    <section id="sec-account" class="space-y-5">
                        <h2 class="text-lg font-extrabold text-slate-800">الحساب وحفظ الجلسة</h2>
                        <div class="bg-white border border-slate-200 rounded-2xl p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-orange-600 text-white rounded-2xl flex items-center justify-center text-2xl font-extrabold">${(currentUser.fullname || currentUser.username)[0].toUpperCase()}</div>
                                <div>
                                    <div class="font-extrabold text-base">${currentUser.fullname}</div>
                                    <div class="text-xs text-slate-500">@${currentUser.username}</div>
                                    <span class="inline-flex items-center gap-1 mt-1 text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full">
                                        <i class="fa-solid fa-circle-check"></i> الجلسة محفوظة تلقائياً
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3">
                            <h3 class="font-bold text-sm">تحديث الاسم الظاهر</h3>
                            <div class="flex gap-2">
                                <input id="new-fullname" type="text" value="${currentUser.fullname}" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-orange-500">
                                <button onclick="updateName()" class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition">حفظ التعديل</button>
                            </div>
                            <p id="save-name-msg" class="text-[11px] text-emerald-600 font-bold hidden">تم تحديث الاسم بنجاح!</p>

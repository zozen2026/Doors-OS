<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors OS - النظام البيئي المستقل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { 
            font-family: 'Tajawal', sans-serif; 
            user-select: none; 
            overflow: hidden;
        }
        .window { 
            transition: box-shadow 0.2s; 
        }
        .window-maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 3.5rem) !important;
            border-radius: 0 !important;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-white flex flex-col justify-between relative bg-cover bg-center" style="background-image: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);">

    <!-- سطح المكتب واختصارات النظام -->
    <div class="p-6 grid grid-cols-4 gap-6 w-fit z-0">
        <!-- 1. Zozen -->
        <div onclick="openApp('zozen')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-orange-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-orange-400/30">
                <i class="fa-solid fa-bolt text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Zozen</span>
        </div>

        <!-- 2. متجر Zozen -->
        <div onclick="openApp('store')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-indigo-400/30">
                <i class="fa-solid fa-store text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">متجر Zozen</span>
        </div>

        <!-- 3. YouTube -->
        <div onclick="openApp('youtube')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-red-400/30">
                <i class="fa-brands fa-youtube text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">YouTube</span>
        </div>

        <!-- 4. Google Chrome -->
        <div onclick="openApp('chrome')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-amber-300/30">
                <i class="fa-brands fa-chrome text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">Google Chrome</span>
        </div>

        <!-- 5. أداة تثبيت النظام خارج المتصفح -->
        <div onclick="openApp('installer')" class="flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition">
            <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-emerald-400/30">
                <i class="fa-solid fa-download text-2xl text-white"></i>
            </div>
            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow">تثبيت Doors</span>
        </div>
    </div>

    <!-- حاوية النوافذ الداخلية -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- قائمة ابدأ (Start Menu) -->
    <div id="start-menu" class="absolute bottom-16 right-4 w-80 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl p-4 hidden flex-col z-50 text-slate-200">
        <div class="flex items-center gap-3 pb-3 border-b border-slate-800 mb-3">
            <div class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center font-bold text-lg text-white">D</div>
            <div>
                <h3 class="font-bold text-sm">Doors OS Environment</h3>
                <span class="text-xs text-orange-400">● سيادة تامة (Standalone App)</span>
            </div>
        </div>
        <div class="space-y-1 text-sm">
            <button onclick="openApp('zozen'); toggleStartMenu();" class="w-full text-right px-3 py-2 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-solid fa-bolt text-orange-400"></i> Zozen
            </button>
            <button onclick="openApp('store'); toggleStartMenu();" class="w-full text-right px-3 py-2 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-solid fa-store text-indigo-400"></i> متجر Zozen
            </button>
            <button onclick="openApp('youtube'); toggleStartMenu();" class="w-full text-right px-3 py-2 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-youtube text-red-400"></i> YouTube
            </button>
            <button onclick="openApp('chrome'); toggleStartMenu();" class="w-full text-right px-3 py-2 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-chrome text-amber-400"></i> Google Chrome
            </button>
            <button onclick="openApp('installer'); toggleStartMenu();" class="w-full text-right px-3 py-2 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition text-emerald-400 font-bold border-t border-slate-800 mt-2">
                <i class="fa-solid fa-download"></i> تثبيت النظام خارج المتصفح
            </button>
        </div>
        <div class="pt-3 mt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
            <span>Doors OS v2.9</span>
            <button onclick="alert('النظام جاهز للتشغيل المستقل!')" class="bg-orange-600/30 hover:bg-orange-600/50 text-orange-300 px-3 py-1.5 rounded-lg transition">الحالة</button>
        </div>
    </div>

    <!-- شريط المهام (Taskbar) -->
    <div class="h-14 bg-slate-900/80 backdrop-blur-md border-t border-slate-800 px-4 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
            <button onclick="toggleStartMenu()" class="h-10 px-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold flex items-center gap-2 shadow-lg transition border border-orange-400/30 text-white">
                <i class="fa-solid fa-door-open text-lg"></i>
                <span>Doors</span>
            </button>
            
            <div id="taskbar-apps" class="flex items-center gap-1 border-r border-slate-700 pr-3"></div>
        </div>

        <div class="flex items-center gap-4 text-xs text-slate-300 font-medium">
            <span class="bg-orange-500/10 text-orange-400 border border-orange-500/20 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved"></i> Standalone Mode
            </span>
            <span id="clock" class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">00:00</span>
        </div>
    </div>

    <script>
        // ساعة النظام
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        window.zIndexCounter = 10;

        // تعريف التطبيقات والروابط
        const appData = {
            'zozen': { 
                title: 'Zozen App', 
                icon: 'fa-bolt text-orange-400', 
                url: 'https://zozen.vercel.app',
                mode: 'internal'
            },
            'store': { 
                title: 'متجر Zozen', 
                icon: 'fa-store text-indigo-400', 
                url: 'https://zozen2026.github.io/Zozen-store/',
                mode: 'internal'
            },
            'youtube': { 
                title: 'YouTube App', 
                icon: 'fa-youtube text-red-500', 
                url: 'https://www.youtube.com',
                mode: 'app'
            },
            'chrome': { 
                title: 'Google Chrome', 
                icon: 'fa-chrome text-amber-400', 
                url: 'https://www.google.com',
                mode: 'app'
            },
            'installer': {
                title: 'أداة تثبيت Doors OS الخارجي',
                icon: 'fa-download text-emerald-400',
                mode: 'installer'
            }
        };

        function openApp(appKey) {
            const app = appData[appKey];

            // فتح التطبيقات الخارجية النقية بدون شريط متصفح
            if (app.mode === 'app') {
                const width = 1000;
                const height = 650;
                const left = (screen.width - width) / 2;
                const top = (screen.height - height) / 2;
                
                window.open(
                    app.url, 
                    `_blank_${appKey}`, 
                    `width=${width},height=${height},top=${top},left=${left},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes,personalbar=no`
                );
                return;
            }

            // معالج نافذة التثبيت الخارجي
            if (app.mode === 'installer') {
                createInstallerWindow(appKey, app);
                return;
            }

            // التطبيقات الداخلية
            const existingWin = document.getElementById(`win-${appKey}`);
            if (existingWin) {
                if (existingWin.style.display === 'none') {
                    existingWin.style.display = 'flex';
                }
                bringToFront(existingWin);
                return;
            }

            const winDiv = document.createElement('div');
            winDiv.id = `win-${appKey}`;
            winDiv.className = 'window absolute top-16 left-20 w-[850px] h-[550px] bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden';
            winDiv.onclick = () => bringToFront(winDiv);

            winDiv.innerHTML = `
                <div class="h-11 bg-slate-800/90 border-b border-slate-700/80 px-4 flex items-center justify-between cursor-move" onmousedown="startDrag(event, '${winDiv.id}')">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${app.icon}"></i>
                        <span class="font-bold text-sm text-slate-200">${app.title}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="minimizeWindow('${winDiv.id}')" class="w-6 h-6 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition" title="تصغير">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>
                        <button onclick="toggleMaximize('${winDiv.id}')" class="w-6 h-6 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition" title="تكبير">
                            <i class="fa-regular fa-square text-xs"></i>
                        </button>
                        <button onclick="closeWindow('${winDiv.id}', '${appKey}')" class="w-6 h-6 rounded-lg bg-red-500/20 hover:bg-red-600 flex items-center justify-center text-red-400 hover:text-white transition" title="إغلاق">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex-1 bg-slate-950">
                    <iframe src="${app.url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            `;

            document.getElementById('windows-container').appendChild(winDiv);
            bringToFront(winDiv);
            addTaskbarIcon(appKey);
        }

        // واجهة مثبت النظام الخارجي
        function createInstallerWindow(appKey, app) {
            const existingWin = document.getElementById(`win-${appKey}`);
            if (existingWin) {
                if (existingWin.style.display === 'none') existingWin.style.display = 'flex';
                bringToFront(existingWin);
                return;
            }

            const winDiv = document.createElement('div');
            winDiv.id = `win-${appKey}`;
            winDiv.className = 'window absolute top-20 left-32 w-[650px] h-[480px] bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden';
            winDiv.onclick = () => bringToFront(winDiv);

            winDiv.innerHTML = `
                <div class="h-11 bg-slate-800/90 border-b border-slate-700/80 px-4 flex items-center justify-between cursor-move" onmousedown="startDrag(event, '${winDiv.id}')">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${app.icon}"></i>
                        <span class="font-bold text-sm text-slate-200">${app.title}</span>
                    </div>
                    <button onclick="closeWindow('${winDiv.id}', '${appKey}')" class="w-6 h-6 rounded-lg bg-red-500/20 hover:bg-red-600 flex items-center justify-center text-red-400 hover:text-white transition">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                <div class="p-6 flex-1 flex flex-col justify-between text-center bg-slate-950">
                    <div>
                        <div class="w-16 h-16 bg-emerald-600/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-400 text-2xl">
                            <i class="fa-solid fa-cloud-arrow-down"></i>
                        </div>
                        <h2 class="text-lg font-bold text-white mb-2">تثبيت Doors OS كبرنامج خارجي مستقل</h2>
                        <p class="text-xs text-slate-400 leading-relaxed max-w-md mx-auto">
                            يمكنك فصل نظام Doors بالكامل عن نافذة المتصفح التقليدية ليصبح تطبيقاً مستقلاً بذاته على جهازك، يعمل بنافذة خاصة بدون أشرطة متصفح ويوضع له اختصار مباشر على سطح المكتب.
                        </p>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-right space-y-2 text-xs">
                        <div class="flex justify-between"><span>نوع التثبيت:</span> <span class="text-emerald-400">Standalone App (خارج المتصفح)</span></div>
                        <div class="flex justify-between"><span>السيادة والأمان:</span> <span class="text-orange-400">Isolated Sandbox (بدون إعلانات)</span></div>
                    </div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button onclick="triggerInstallPrompt()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                            <i class="fa-solid fa-desktop"></i> تثبيت فوري الآن
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('windows-container').appendChild(winDiv);
            bringToFront(winDiv);
            addTaskbarIcon(appKey);
        }

        function triggerInstallPrompt() {
            alert("لإتمام تثبيت Doors OS كتطبيق مستقل خارج المتصفح تماماً:\n\n1. من متصفحك (Google Chrome أو Edge)، اضغط على قائمة الثلاث نقاط بالأعلى.\n2. اختر 'حفظ ومشاركة' ثم 'تثبيت Doors OS' (أو Install App).\n3. سيتحول النظام فوراً إلى برنامج مستقل وخاص على جهازك!");
        }

        function bringToFront(winEl) {
            winEl.style.zIndex = ++window.zIndexCounter;
        }

        function closeWindow(winId, appKey) {
            document.getElementById(winId)?.remove();
            document.getElementById(`tb-${appKey}`)?.remove();
        }

        function minimizeWindow(winId) {
            const win = document.getElementById(winId);
            if (win) win.style.display = 'none';
        }

        function toggleMaximize(winId) {
            const win = document.getElementById(winId);
            win.classList.toggle('window-maximized');
        }

        function addTaskbarIcon(appKey) {
            const taskbarApps = document.getElementById('taskbar-apps');
            if (document.getElementById(`tb-${appKey}`)) return;

            const btn = document.createElement('button');
            btn.id = `tb-${appKey}`;
            btn.className = 'w-10 h-10 hover:bg-white/10 rounded-xl flex items-center justify-center transition text-lg bg-slate-800/60 border border-slate-700/50';
            btn.onclick = () => openApp(appKey);
            btn.innerHTML = `<i class="fa-solid ${appData[appKey].icon}"></i>`;
            taskbarApps.appendChild(btn);
        }

        function startDrag(e, winId) {
            const win = document.getElementById(winId);
            if (win.classList.contains('window-maximized')) return;

            bringToFront(win);
            let startX = e.clientX - win.offsetLeft;
            let startY = e.clientY - win.offsetTop;

            function onMouseMove(e) {
                win.style.left = (e.clientX - startX) + 'px';
                win.style.top = (e.clientY - startY) + 'px';
            }

            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }
    </script>
</body>
</html>

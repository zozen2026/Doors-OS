<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors v1.0 - Sovereign Hardware Environment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            user-select: none; 
            overflow: hidden;
        }
        .window { 
            transition: box-shadow 0.2s; 
        }
        .window-maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 3.5rem) !important;
            border-radius: 0 !important;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(249, 115, 22, 0.8); }
    </style>
</head>
<body id="os-body" class="h-screen w-screen text-white flex flex-col justify-between relative bg-cover bg-center bg-no-repeat transition-all duration-500" style="background-image: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);">

    <!-- Dynamic Desktop Icons Grid -->
    <div id="desktop-grid" class="p-6 grid grid-cols-4 sm:grid-cols-6 gap-5 w-fit z-0 transition-opacity duration-300">
        <!-- يتم تعبئة الأيقونات ديناميكياً -->
    </div>

    <!-- Hidden File Input for Studio Wallpaper -->
    <input type="file" id="studio-wallpaper-input" accept="image/*" class="hidden" onchange="handleStudioWallpaperUpload(event)">

    <!-- Windows Container -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- 1. Background Context Menu -->
    <div id="context-menu" class="absolute hidden w-56 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl p-1.5 z-50 text-slate-200 text-xs">
        <button onclick="refreshDesktop()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-rotate"></i> Refresh System
        </button>
        
        <div class="relative group">
            <button class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center justify-between transition">
                <span class="flex items-center gap-3"><i class="fa-solid fa-plus text-orange-400"></i> New +</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
            <div class="absolute left-full top-0 ml-1.5 hidden group-hover:block w-48 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl p-1.5 text-slate-200 text-xs z-50">
                <button onclick="createNewDesktopItem('folder')" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
                    <i class="fa-solid fa-folder text-amber-400"></i> New Folder
                </button>
                <button onclick="createNewDesktopItem('txt')" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
                    <i class="fa-solid fa-file-lines text-sky-400"></i> Text Document (.txt)
                </button>
                <button onclick="createNewDesktopItem('sheet')" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i> Spreadsheet (.xls)
                </button>
            </div>
        </div>

        <button onclick="document.getElementById('studio-wallpaper-input').click()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-images text-orange-400"></i> Set Wallpaper from Studio
        </button>
        <button onclick="openApp('settings')" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-sliders"></i> Personalize & Settings
        </button>
        <div class="h-px bg-slate-800 my-1"></div>
        <button onclick="openApp('installer')" class="w-full text-left px-3 py-2 text-orange-400 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition font-bold">
            <i class="fa-solid fa-compact-disc"></i> Download Doors v1.0 ISO
        </button>
        <button onclick="openAuthModal()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-user-circle"></i> Account / Sign In
        </button>
    </div>

    <!-- 2. Item Context Menu -->
    <div id="item-context-menu" class="absolute hidden w-48 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl p-1.5 z-50 text-slate-200 text-xs">
        <button onclick="itemActionOpen()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-folder-open text-orange-400"></i> Open
        </button>
        <button onclick="itemActionCopy()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-copy text-sky-400"></i> Copy
        </button>
        <button onclick="itemActionShortcut()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-link text-amber-400"></i> Create Shortcut
        </button>
        <button onclick="itemActionRename()" class="w-full text-left px-3 py-2 hover:bg-orange-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-pen text-indigo-400"></i> Change Name
        </button>
        <div id="delete-divider" class="h-px bg-slate-800 my-1"></div>
        <button id="delete-btn-action" onclick="itemActionDelete()" class="w-full text-left px-3 py-2 text-red-400 hover:bg-red-600 hover:text-white rounded-lg flex items-center gap-3 transition">
            <i class="fa-solid fa-trash"></i> Delete
        </button>
    </div>

    <!-- In-System Custom Notification Modal -->
    <div id="os-notification" class="absolute inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 pointer-events-auto">
        <div class="bg-slate-900 border border-orange-500/40 w-[420px] rounded-2xl p-6 shadow-2xl text-slate-200 text-center relative">
            <div id="notif-icon" class="w-12 h-12 bg-orange-600/20 text-orange-400 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3 border border-orange-500/30">
                <i class="fa-solid fa-download animate-bounce"></i>
            </div>
            <h3 id="notif-title" class="font-bold text-base text-white mb-1">Preparing ISO Package</h3>
            <p id="notif-desc" class="text-xs text-slate-400 mb-4">Building bootloader configuration and system images...</p>
            
            <div class="w-full bg-slate-950 rounded-full h-2.5 mb-4 border border-slate-800 overflow-hidden">
                <div id="notif-progress" class="bg-gradient-to-r from-orange-600 to-amber-500 h-2.5 rounded-full w-0 transition-all duration-300"></div>
            </div>

            <button onclick="closeOsNotification()" id="notif-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-xl text-xs transition hidden">Close / Done</button>
        </div>
    </div>

    <!-- Auth / Account Modal -->
    <div id="auth-modal" class="absolute inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-700 w-96 rounded-2xl p-6 shadow-2xl text-slate-200 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-6">
                <div id="modal-avatar" class="w-12 h-12 bg-orange-600 rounded-2xl mx-auto flex items-center justify-center text-white text-xl font-bold mb-2">D</div>
                <h3 class="font-bold text-base text-white">Doors v1.0 Sovereign Account</h3>
                <p id="auth-subtitle" class="text-xs text-slate-400">Your session remains active across restarts</p>
            </div>
            <div id="auth-form-content" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Email / Username</label>
                    <input type="text" id="auth-user" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="user@doors.os">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-pass" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
                </div>
                <button onclick="handleAuthSubmit()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg">Sign In & Save Session</button>
                <div class="text-center pt-2 flex justify-between items-center border-t border-slate-800">
                    <span class="text-emerald-400 text-[11px]"><i class="fa-solid fa-shield-halved"></i> Persistent Storage Active</span>
                    <button onclick="handleLogout()" class="text-red-400 font-bold hover:underline">Sign Out</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="absolute bottom-16 left-4 w-72 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl p-4 hidden flex-col z-50 text-slate-200">
        <div class="flex items-center gap-3 pb-3 border-b border-slate-800 mb-3">
            <div id="user-avatar-letter" class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center font-bold text-lg text-white">D</div>
            <div class="overflow-hidden">
                <h3 id="current-user-display" class="font-bold text-sm truncate">Guest User</h3>
                <span id="session-status-badge" class="text-xs text-slate-400">● Local Guest Session</span>
            </div>
        </div>
        <div class="space-y-1 text-sm max-h-60 overflow-y-auto">
            <button onclick="openApp('installer'); toggleStartMenu();" class="w-full text-left px-3 py-2 bg-orange-600/20 text-orange-400 font-bold rounded-lg flex items-center gap-3 transition mb-1">
                <i class="fa-solid fa-compact-disc"></i> Download Doors v1.0 (ISO)
            </button>
            <button onclick="openApp('zozen'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-solid fa-bolt text-orange-400"></i> Zozen
            </button>
            <button onclick="openApp('store'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-solid fa-store text-indigo-400"></i> Zozen Store
            </button>
            <button onclick="openApp('browser'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-chrome text-amber-400"></i> Browser Hub
            </button>
            <button onclick="openApp('gemini'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i> Google Gemini
            </button>
            <button onclick="openApp('telegram'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-telegram text-sky-400"></i> Telegram
            </button>
            <button onclick="openApp('youtube'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-youtube text-red-400"></i> YouTube
            </button>
            <button onclick="openApp('facebook'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-facebook-f text-blue-400"></i> Facebook
            </button>
            <button onclick="openApp('tiktok'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-tiktok text-white"></i> TikTok
            </button>
            <button onclick="openApp('instagram'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-instagram text-pink-400"></i> Instagram
            </button>
            <button onclick="openApp('whatsapp'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition">
                <i class="fa-brands fa-whatsapp text-emerald-400"></i> WhatsApp
            </button>
            <button onclick="openApp('settings'); toggleStartMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 rounded-lg flex items-center gap-3 transition border-t border-slate-800 mt-1 pt-2">
                <i class="fa-solid fa-gear text-slate-400"></i> System Settings
            </button>
        </div>
        <div class="pt-3 mt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
            <span>Doors v1.0</span>
            <button onclick="openAuthModal(); toggleStartMenu();" class="text-orange-400 font-bold hover:underline">Account</button>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="os-taskbar" class="h-14 bg-slate-900/80 backdrop-blur-md border-t border-slate-800 px-4 flex items-center justify-between z-40 transition-all">
        <div class="flex items-center gap-3">
            <button onclick="toggleStartMenu()" class="h-10 px-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold flex items-center gap-2 shadow-lg transition border border-orange-400/30 text-white">
                <i class="fa-solid fa-door-open text-lg"></i>
                <span>Doors</span>
            </button>
            
            <div id="taskbar-apps" class="flex items-center gap-1 border-l border-slate-700 pl-3 overflow-x-auto"></div>
        </div>

        <div class="flex items-center gap-3 text-xs text-slate-300 font-medium">
            <button onclick="openAuthModal()" id="taskbar-user-pill" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 transition">
                <i class="fa-solid fa-user-check text-orange-400"></i>
                <span id="taskbar-username">Guest User</span>
            </button>
            <span class="hidden sm:flex bg-orange-500/10 text-orange-400 border border-orange-500/20 px-2.5 py-1.5 rounded-xl items-center gap-1.5">
                <i class="fa-solid fa-microchip"></i> Hardware-Ready OS
            </span>
            <span id="clock" class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">00:00</span>
        </div>
    </div>

    <script>
        const defaultDesktopApps = [
            { id: 'zozen', title: 'Zozen', icon: 'fa-solid fa-bolt text-white', bg: 'bg-orange-600 border-orange-400/30', type: 'app' },
            { id: 'store', title: 'Zozen Store', icon: 'fa-solid fa-store text-white', bg: 'bg-indigo-600 border-indigo-400/30', type: 'app' },
            { id: 'installer', title: 'Get Doors', icon: 'fa-solid fa-compact-disc text-white', bg: 'bg-gradient-to-tr from-orange-600 to-amber-500 border-orange-300/40 animate-pulse', type: 'app' },
            { id: 'browser', title: 'Browser Hub', icon: 'fa-brands fa-chrome text-white', bg: 'bg-amber-500 border-amber-300/30', type: 'app' },
            { id: 'gemini', title: 'Gemini', icon: 'fa-solid fa-wand-magic-sparkles text-white', bg: 'bg-blue-600 border-blue-400/30', type: 'app' },
            { id: 'telegram', title: 'Telegram', icon: 'fa-brands fa-telegram text-white', bg: 'bg-sky-500 border-sky-300/30', type: 'app' },
            { id: 'youtube', title: 'YouTube', icon: 'fa-brands fa-youtube text-white', bg: 'bg-red-600 border-red-400/30', type: 'app' },
            { id: 'facebook', title: 'Facebook', icon: 'fa-brands fa-facebook-f text-white', bg: 'bg-blue-600 border-blue-400/30', type: 'app' },
            { id: 'tiktok', title: 'TikTok', icon: 'fa-brands fa-tiktok text-white', bg: 'bg-black border-zinc-700', type: 'app' },
            { id: 'instagram', title: 'Instagram', icon: 'fa-brands fa-instagram text-white', bg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-purple-600 border-pink-400/30', type: 'app' },
            { id: 'whatsapp', title: 'WhatsApp', icon: 'fa-brands fa-whatsapp text-white', bg: 'bg-emerald-600 border-emerald-400/30', type: 'app' },
            { id: 'settings', title: 'Settings', icon: 'fa-solid fa-gear text-slate-200', bg: 'bg-slate-700 border-slate-500/30', type: 'app' }
        ];

        function renderDesktopGrid() {
            const grid = document.getElementById('desktop-grid');
            if (!grid) return;

            let userItems = [];
            try {
                userItems = JSON.parse(localStorage.getItem('doors_os_user_items')) || [];
            } catch(e) { userItems = []; }

            const allItems = [...defaultDesktopApps, ...userItems];
            
            grid.innerHTML = allItems.map(item => {
                if (item.type === 'app') {
                    return `
                        <div onclick="openApp('${item.id}')" 
                             class="desktop-item flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition"
                             data-id="${item.id}" data-type="app" data-title="${item.title}">
                            <div class="w-14 h-14 ${item.bg} rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border">
                                <i class="${item.icon} text-2xl"></i>
                            </div>
                            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] truncate max-w-[70px]">${item.title}</span>
                        </div>
                    `;
                } else {
                    let iconClass = "fa-solid fa-folder text-amber-400";
                    if (item.type === 'txt') iconClass = "fa-solid fa-file-lines text-sky-400";
                    if (item.type === 'sheet') iconClass = "fa-solid fa-file-excel text-emerald-400";

                    return `
                        <div onclick="alert('Opening ${item.title}')" 
                             class="desktop-item flex flex-col items-center cursor-pointer group p-2 rounded-xl hover:bg-white/10 transition relative"
                             data-id="${item.id}" data-type="${item.type}" data-title="${item.title}">
                            <div class="w-14 h-14 bg-slate-800/90 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition border border-slate-700">
                                <i class="${iconClass} text-2xl"></i>
                            </div>
                            <span class="text-xs mt-2 text-slate-200 font-medium drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] truncate max-w-[70px]">${item.title}</span>
                        </div>
                    `;
                }
            }).join('');
        }

        function createNewDesktopItem(type) {
            let defaultName = "New Folder";
            if (type === 'txt') defaultName = "New Document.txt";
            if (type === 'sheet') defaultName = "New Spreadsheet.xls";

            const name = prompt("Enter name for the new item:", defaultName);
            if (!name) return;

            let userItems = [];
            try {
                userItems = JSON.parse(localStorage.getItem('doors_os_user_items')) || [];
            } catch(e) { userItems = []; }

            userItems.push({
                id: 'custom_' + Date.now(),
                title: name,
                type: type
            });

            localStorage.setItem('doors_os_user_items', JSON.stringify(userItems));
            renderDesktopGrid();
        }

        const contextMenu = document.getElementById('context-menu');
        const itemContextMenu = document.getElementById('item-context-menu');
        let currentSelectedItem = null;

        window.addEventListener('click', () => {
            contextMenu.classList.add('hidden');
            itemContextMenu.classList.add('hidden');
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            contextMenu.classList.add('hidden');
            itemContextMenu.classList.add('hidden');

            const itemElement = e.target.closest('.desktop-item');
            if (itemElement) {
                currentSelectedItem = {
                    id: itemElement.dataset.id,
                    type: itemElement.dataset.type,
                    title: itemElement.dataset.title
                };

                const isDefaultApp = defaultDesktopApps.some(a => a.id === currentSelectedItem.id);
                const deleteBtn = document.getElementById('delete-btn-action');
                const deleteDivider = document.getElementById('delete-divider');

                if (isDefaultApp && !currentSelectedItem.title.includes('Shortcut')) {
                    if (deleteBtn) deleteBtn.classList.add('hidden');
                    if (deleteDivider) deleteDivider.classList.add('hidden');
                } else {
                    if (deleteBtn) deleteBtn.classList.remove('hidden');
                    if (deleteDivider) deleteDivider.classList.remove('hidden');
                }

                itemContextMenu.style.top = `${e.clientY}px`;
                itemContextMenu.style.left = `${e.clientX}px`;
                itemContextMenu.classList.remove('hidden');
            } else {
                contextMenu.style.top = `${e.clientY}px`;
                contextMenu.style.left = `${e.clientX}px`;
                contextMenu.classList.remove('hidden');
            }
        });

        function itemActionOpen() {
            if (!currentSelectedItem) return;
            if (currentSelectedItem.type === 'app') {
                openApp(currentSelectedItem.id);
            } else {
                alert(`Opening ${currentSelectedItem.title}`);
            }
            itemContextMenu.classList.add('hidden');
        }

        function itemActionCopy() {
            if (!currentSelectedItem) return;
            navigator.clipboard.writeText(currentSelectedItem.title);
            alert(`Copied "${currentSelectedItem.title}" to clipboard!`);
            itemContextMenu.classList.add('hidden');
        }

        function itemActionShortcut() {
            if (!currentSelectedItem) return;
            const origApp = defaultDesktopApps.find(a => a.id === currentSelectedItem.id);
            let userItems = [];
            try { userItems = JSON.parse(localStorage.getItem('doors_os_user_items')) || []; } catch(e){}
            
            userItems.push({
                id: currentSelectedItem.id,
                title: currentSelectedItem.title + " - Shortcut",
                type: currentSelectedItem.type,
                icon: origApp ? origApp.icon : 'fa-solid fa-link text-amber-400',
                bg: origApp ? origApp.bg : 'bg-slate-800 border-slate-600'
            });
            localStorage.setItem('doors_os_user_items', JSON.stringify(userItems));
            renderDesktopGrid();
            itemContextMenu.classList.add('hidden');
        }

        function itemActionRename() {
            if (!currentSelectedItem) return;
            const newName = prompt("Enter new name:", currentSelectedItem.title);
            if (!newName) return;

            if (currentSelectedItem.type === 'app') {
                alert("Core system apps cannot be renamed.");
                return;
            }

            let userItems = [];
            try { userItems = JSON.parse(localStorage.getItem('doors_os_user_items')) || []; } catch(e){}
            
            userItems = userItems.map(item => {
                if (item.id === currentSelectedItem.id) {
                    item.title = newName;
                }
                return item;
            });
            localStorage.setItem('doors_os_user_items', JSON.stringify(userItems));
            renderDesktopGrid();
            itemContextMenu.classList.add('hidden');
        }

        function itemActionDelete() {
            if (!currentSelectedItem) return;
            if (confirm(`هل أنت متأكد من حذف "${currentSelectedItem.title}"؟`)) {
                let userItems = [];
                try { userItems = JSON.parse(localStorage.getItem('doors_os_user_items')) || []; } catch(e){}
                
                userItems = userItems.filter(item => item.id !== currentSelectedItem.id && item.title !== currentSelectedItem.title);
                localStorage.setItem('doors_os_user_items', JSON.stringify(userItems));
                renderDesktopGrid();
            }
            itemContextMenu.classList.add('hidden');
        }

        function refreshDesktop() { location.reload(); }

        function applySavedWallpaper() {
            const customImg = localStorage.getItem('doors_os_custom_wallpaper');
            const savedGradient = localStorage.getItem('doors_os_wallpaper_css');
            const osBody = document.getElementById('os-body');

            if (customImg) {
                osBody.style.backgroundImage = `url('${customImg}')`;
                osBody.style.backgroundSize = "cover";
                osBody.style.backgroundPosition = "center";
            } else if (savedGradient) {
                osBody.style.backgroundImage = savedGradient;
            }
        }

        function handleStudioWallpaperUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgDataUrl = e.target.result;
                try {
                    localStorage.setItem('doors_os_custom_wallpaper', imgDataUrl);
                    localStorage.removeItem('doors_os_wallpaper_css');
                    applySavedWallpaper();
                } catch (err) {
                    console.error(err);
                }
            };
            reader.readAsDataURL(file);
        }

        function initSystemSession() {
            const savedUser = localStorage.getItem('doors_os_user');
            const isLoggedIn = localStorage.getItem('doors_os_logged_in');

            const startMenuUser = document.getElementById('current-user-display');
            const taskbarUser = document.getElementById('taskbar-username');
            const statusBadge = document.getElementById('session-status-badge');
            const avatarLetter = document.getElementById('user-avatar-letter');
            const modalAvatar = document.getElementById('modal-avatar');
            const authInput = document.getElementById('auth-user');

            if (isLoggedIn === 'true' && savedUser) {
                if (startMenuUser) startMenuUser.innerText = savedUser;
                if (taskbarUser) taskbarUser.innerText = savedUser;
                if (statusBadge) {
                    statusBadge.innerText = "● Sovereign Session Active";
                    statusBadge.className = "text-xs text-emerald-400 font-medium";
                }
                const initial = savedUser.charAt(0).toUpperCase();
                if (avatarLetter) avatarLetter.innerText = initial;
                if (modalAvatar) modalAvatar.innerText = initial;
                if (authInput) authInput.value = savedUser;
            }
        }

        const openWindows = {};

        function openApp(appId) {
            const container = document.getElementById('windows-container');
            const taskbarApps = document.getElementById('taskbar-apps');

            if (openWindows[appId]) {
                bringToFront(appId);
                return;
            }

            // إذا تم الضغط على زر المتصفح، سنقوم بفتحه كصفحة بحث تفاعلية آمنة أو عبر نافذة مستقلة لتفادي حظر جوجل
            if (appId === 'browser') {
                window.open('https://www.google.com', '_blank');
                return;
            }

            let title = appId.toUpperCase();
            let icon = "fa-solid fa-window-maximize";
            let contentUrl = "";

            if (appId === 'gemini') {
                title = "Google Gemini";
                icon = "fa-solid fa-wand-magic-sparkles text-blue-400";
                contentUrl = "https://gemini.google.com";
            } else if (appId === 'youtube') {
                title = "YouTube";
                icon = "fa-brands fa-youtube text-red-400";
                contentUrl = "https://www.youtube.com";
            } else if (appId === 'telegram') {
                title = "Telegram";
                icon = "fa-brands fa-telegram text-sky-400";
                contentUrl = "https://web.telegram.org";
            } else if (appId === 'installer') {
                title = "Doors ISO Builder";
                icon = "fa-solid fa-compact-disc text-orange-400";
            } else if (appId === 'settings') {
                title = "System Settings";
                icon = "fa-solid fa-gear text-slate-300";
            } else {
                contentUrl = "https://www.bing.com";
            }

            const winEl = document.createElement('div');
            winEl.id = `window-${appId}`;
            winEl.className = "window absolute bg-slate-900 border border-slate-700 rounded-xl shadow-2xl flex flex-col pointer-events-auto overflow-hidden";
            winEl.style.top = "80px";
            winEl.style.left = "120px";
            winEl.style.width = "750px";
            winEl.style.height = "480px";
            winEl.style.zIndex = getNextZIndex();

            let windowBodyContent = `<iframe src="${contentUrl}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
            
            if (appId === 'installer') {
                windowBodyContent = `
                    <div class="p-6 text-slate-200 h-full flex flex-col justify-center items-center text-center">
                        <i class="fa-solid fa-compact-disc text-5xl text-orange-500 mb-4 animate-spin"></i>
                        <h2 class="text-xl font-bold mb-2">Doors v1.0 Sovereign ISO</h2>
                        <p class="text-xs text-slate-400 max-w-md mb-6">Ready to generate dual-boot image package and integrate your custom web environment into hardware bootloader.</p>
                        <button onclick="startIsoDownloadSimulation()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-2.5 rounded-xl transition text-xs shadow-lg">Download / Generate ISO</button>
                    </div>
                `;
            }

            winEl.innerHTML = `
                <div class="window-header h-10 bg-slate-950 px-4 flex items-center justify-between cursor-move border-b border-slate-800" onmousedown="bringToFront('${appId}')">
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-200">
                        <i class="${icon}"></i>
                        <span>${title}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="minimizeWindow('${appId}')" class="w-3.5 h-3.5 bg-amber-500 rounded-full hover:opacity-80 transition"></button>
                        <button onclick="maximizeWindow('${appId}')" class="w-3.5 h-3.5 bg-emerald-500 rounded-full hover:opacity-80 transition"></button>
                        <button onclick="closeWindow('${appId}')" class="w-3.5 h-3.5 bg-rose-500 rounded-full hover:opacity-80 transition"></button>
                    </div>
                </div>
                <div class="flex-grow bg-slate-900 overflow-hidden relative">
                    ${windowBodyContent}
                </div>
            `;

            container.appendChild(winEl);
            openWindows[appId] = winEl;

            const taskBtn = document.createElement('button');
            taskBtn.id = `task-btn-${appId}`;
            taskBtn.className = "px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs flex items-center gap-2 border border-slate-700 transition";
            taskBtn.innerHTML = `<i class="${icon}"></i><span class="truncate max-w-[100px]">${title}</span>`;
            taskBtn.onclick = () => toggleWindowMinimize(appId);
            taskbarApps.appendChild(taskBtn);

            makeWindowDraggable(winEl);
        }

        let highestZIndex = 10;
        function getNextZIndex() { return ++highestZIndex; }

        function bringToFront(appId) {
            if (openWindows[appId]) {
                openWindows[appId].style.zIndex = getNextZIndex();
            }
        }

        function closeWindow(appId) {
            if (openWindows[appId]) {
                openWindows[appId].remove();
                delete openWindows[appId];
            }
            const taskBtn = document.getElementById(`task-btn-${appId}`);
            if (taskBtn) taskBtn.remove();
        }

        function maximizeWindow(appId) {
            const win = openWindows[appId];
            if (win) win.classList.toggle('window-maximized');
        }

        function minimizeWindow(appId) {
            const win = openWindows[appId];
            if (win) win.style.display = 'none';
        }

        function toggleWindowMinimize(appId) {
            const win = openWindows[appId];
            if (win) {
                if (win.style.display === 'none') {
                    win.style.display = 'flex';
                    bringToFront(appId);
                } else {
                    win.style.display = 'none';
                }
            }
        }

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function openAuthModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeAuthModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) modal.classList.add('hidden');
        }

        function handleAuthSubmit() {
            const user = document.getElementById('auth-user').value.trim();
            if (!user) return;
            localStorage.setItem('doors_os_user', user);
            localStorage.setItem('doors_os_logged_in', 'true');
            initSystemSession();
            closeAuthModal();
        }

        function handleLogout() {
            localStorage.removeItem('doors_os_user');
            localStorage.setItem('doors_os_logged_in', 'false');
            location.reload();
        }

        function startIsoDownloadSimulation() {
            const notif = document.getElementById('os-notification');
            const progress = document.getElementById('notif-progress');
            const btn = document.getElementById('notif-btn');
            if (notif) notif.classList.remove('hidden');
            let w = 0;
            const interval = setInterval(() => {
                w += 10;
                if (progress) progress.style.width = w + '%';
                if (w >= 100) {
                    clearInterval(interval);
                    if (btn) btn.classList.remove('hidden');
                }
            }, 250);
        }

        function closeOsNotification() {
            const notif = document.getElementById('os-notification');
            if (notif) notif.classList.add('hidden');
        }

        function makeWindowDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = elmnt.querySelector('.window-header');
            if (header) header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        setInterval(() => {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.innerText = timeString;
        }, 1000);

        window.onload = function() {
            renderDesktopGrid();
            applySavedWallpaper();
            initSystemSession();
        };
    </script>
</body>
</html>

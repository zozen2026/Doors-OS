<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors v1.0 - Sovereign Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            user-select: none; 
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        .desktop-item {
            position: absolute;
            cursor: pointer;
            touch-action: none;
            width: 86px;
        }
        .desktop-item:active {
            cursor: grabbing;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 1); border-radius: 10px; }
    </style>
</head>
<body class="relative bg-slate-100 text-slate-800" style="background-image: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);">

    <!-- سطح مكتب النظام -->
    <div id="desktop-area" class="absolute inset-0 bottom-14 z-0 overflow-hidden"></div>

    <!-- نافذة مخصصة حصرياً لمتجرنا الداخلي (عبر iframe داخلي) -->
    <div id="doors-store-window" class="absolute inset-6 bottom-20 bg-white/95 backdrop-blur-2xl border border-slate-200 rounded-2xl shadow-2xl hidden flex-col z-50 overflow-hidden">
        <div class="h-12 bg-slate-100 border-b border-slate-200 px-4 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-xs text-slate-700">
                <i class="fa-solid fa-store text-indigo-600"></i>
                <span id="store-window-title">Zozen Store - متجر النظام الداخلي</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">متجر رسمي مدمج</span>
                <button onclick="closeStoreWindow()" class="w-7 h-7 bg-red-100 text-red-600 hover:bg-red-600 hover:text-white rounded-lg flex items-center justify-center transition text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 w-full h-full bg-white relative" id="store-window-body">
            <!-- سيتم تحميل واجهة المتجر أو بوابة المطورين هنا -->
        </div>
    </div>

    <!-- مربع بحث زوزين الذكي -->
    <div id="zozen-search-modal" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-start justify-center pt-24 z-50">
        <div class="bg-white border border-slate-200 w-[600px] rounded-2xl p-5 shadow-2xl text-slate-800">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <div class="flex items-center gap-2 font-bold text-sm text-orange-600">
                    <i class="fa-solid fa-bolt"></i> Zozen Sovereign Search Hub
                </div>
                <button onclick="toggleZozenSearch()" class="text-slate-400 hover:text-slate-700 text-base"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="relative mb-4">
                <input type="text" id="zozen-search-input" onkeypress="handleSearchKey(event)" placeholder="ابحث عن تطبيق أو موقع داخل Doors..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-800 shadow-inner">
                <button onclick="executeZozenSearch()" class="absolute right-2 top-2 bg-orange-600 hover:bg-orange-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition shadow">
                    بحث
                </button>
            </div>
            <div id="zozen-search-results" class="max-h-72 overflow-y-auto space-y-2 text-xs">
                <div class="text-center py-8 text-slate-400">
                    <i class="fa-solid fa-search text-2xl mb-2 text-slate-300 block"></i>
                    ابحث عن أي موقع أو تطبيق للوصول السريع!
                </div>
            </div>
        </div>
    </div>

    <!-- شريط المهام -->
    <div class="h-14 bg-white/90 backdrop-blur-md border-t border-slate-200 px-4 flex items-center justify-between z-40 fixed bottom-0 left-0 right-0 text-slate-800">
        <div class="flex items-center gap-2.5">
            <button onclick="toggleZozenSearch()" class="h-10 px-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold flex items-center gap-2 shadow-lg transition text-white text-xs">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>بحث زوزين الذكي</span>
            </button>
            <button onclick="openZozenStore()" class="h-10 px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold flex items-center gap-2 shadow-lg transition text-white text-xs">
                <i class="fa-solid fa-store"></i>
                <span>متجر زوزين الداخلي</span>
            </button>
        </div>
        <div class="text-xs text-slate-600 font-medium">
            <span id="clock" class="bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">00:00</span>
        </div>
    </div>

    <script>
        // التطبيقات المثبتة مسبقاً في النظام (بما فيها Steam ومتجر زوزين)
        let installedApps = JSON.parse(localStorage.getItem('doors_ecosystem_apps')) || [
            { id: 'store', title: 'Zozen Store', type: 'store', icon: 'fa-solid fa-store', bg: 'bg-indigo-600', company: 'Zozen Corp' },
            { id: 'steam', title: 'Steam', type: 'url', url: 'https://store.steampowered.com', icon: 'fa-brands fa-steam', bg: 'bg-slate-900', company: 'Valve Corporation', desc: 'منصة الألعاب العالمية' },
            { id: 'zozen', title: 'Zozen App', type: 'url', url: 'https://zozen.vercel.app', icon: 'fa-solid fa-bolt', bg: 'bg-orange-600', company: 'Zozen Ecosystem' },
            { id: 'youtube', title: 'YouTube', type: 'url', url: 'https://www.youtube.com', icon: 'fa-brands fa-youtube', bg: 'bg-red-600', company: 'Google' }
        ];

        // تشغيل التطبيقات: المتجر داخلياً، والتطبيقات الخارجية في نافذة مستقلة
        function launchApp(appId) {
            const app = installedApps.find(a => a.id === appId);
            if (!app) return;

            if (app.type === 'store') {
                openZozenStore();
            } else {
                const width = Math.min(1150, window.screen.availWidth - 80);
                const height = Math.min(750, window.screen.availHeight - 80);
                const left = Math.round((window.screen.availWidth - width) / 2);
                const top = Math.round((window.screen.availHeight - height) / 2);

                const windowFeatures = [
                    'popup=yes',
                    `width=${width}`,
                    `height=${height}`,
                    `left=${left}`,
                    `top=${top}`,
                    'toolbar=no',
                    'menubar=no',
                    'location=no',
                    'status=no',
                    'scrollbars=yes',
                    'resizable=yes'
                ].join(',');

                const winName = 'DoorsApp_' + app.title.replace(/\s+/g, '_');
                const openedWin = window.open(app.url, winName, windowFeatures);
                if (openedWin) openedWin.focus();
                else alert('يرجى السماح بالنوافذ المنبثقة لتشغيل التطبيق بشكل مستقل.');
            }
        }

        // إدارة متجر زوزين الداخلي وبوابة المطورين
        function openZozenStore() {
            const windowEl = document.getElementById('doors-store-window');
            const bodyEl = document.getElementById('store-window-body');

            let storeHtml = `
                <div class="p-6 max-w-4xl mx-auto space-y-8">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-store text-indigo-600"></i> التطبيقات المثبتة والمتاحة في النظام</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="store-apps-grid"></div>
                    </div>

                    <!-- بوابة المطورين المدمجة في المتجر -->
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h3 class="text-base font-bold text-orange-600 mb-4 flex items-center gap-2"><i class="fa-solid fa-code"></i> بوابة المطورين (تثبيت تطبيق جديد في نظام Doors)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">شعار التطبيق (Icon class / FontAwesome)</label>
                                <input type="text" id="dev-app-icon" value="fa-solid fa-cube" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">اسم التطبيق *</label>
                                <input type="text" id="dev-app-name" placeholder="مثال: تطبيق الألعاب" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">اسم الشركة أو الجهة المطورة</label>
                                <input type="text" id="dev-company-name" placeholder="مثال: Valve" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">اسم المطور الشخصي (اختياري - Optional)</label>
                                <input type="text" id="dev-person-name" placeholder="اسمك الكريم" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">رقم الإصدار (Version)</label>
                                <input type="text" id="dev-app-version" value="1.0.0" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">رابط التطبيق (URL) *</label>
                                <input type="url" id="dev-app-url" placeholder="https://..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block font-semibold mb-1 text-slate-700">الوصف (Description)</label>
                                <textarea id="dev-app-desc" rows="2" placeholder="ما الذي يفعله هذا التطبيق..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500"></textarea>
                            </div>
                        </div>
                        <button onclick="installAppFromStore()" class="mt-4 w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition shadow text-xs">
                            <i class="fa-solid fa-download mr-1"></i> تثبيت التطبيق في نظام Doors
                        </button>
                    </div>
                </div>
            `;

            bodyEl.innerHTML = storeHtml;
            windowEl.classList.remove('hidden');
            windowEl.classList.add('flex');
            renderStoreGrid();
        }

        function renderStoreGrid() {
            const grid = document.getElementById('store-apps-grid');
            if (!grid) return;
            grid.innerHTML = '';

            installedApps.forEach(app => {
                const div = document.createElement('div');
                div.className = "bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex items-center justify-between";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 ${app.bg || 'bg-orange-600'} text-white rounded-xl flex items-center justify-center text-lg"><i class="${app.icon || 'fa-solid fa-cube'}"></i></div>
                        <div>
                            <h4 class="font-bold text-sm text-slate-800">${app.title} <span class="text-[10px] text-slate-400">v${app.version || '1.0'}</span></h4>
                            <p class="text-[11px] text-slate-500">${app.company || 'Zozen Ecosystem'} ${app.developer ? '• ' + app.developer : ''}</p>
                            <p class="text-[10px] text-orange-600 mt-0.5">${app.desc || 'تطبيق مثبت في النظام'}</p>
                        </div>
                    </div>
                    <button onclick="launchApp('${app.id}'); closeStoreWindow();" class="bg-slate-100 hover:bg-indigo-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">فتح</button>
                `;
                grid.appendChild(div);
            });
        }

        function installAppFromStore() {
            const icon = document.getElementById('dev-app-icon').value.trim() || 'fa-solid fa-cube';
            const title = document.getElementById('dev-app-name').value.trim();
            const company = document.getElementById('dev-company-name').value.trim() || 'Zozen Developer';
            const developer = document.getElementById('dev-person-name').value.trim();
            const version = document.getElementById('dev-app-version').value.trim() || '1.0';
            const url = document.getElementById('dev-app-url').value.trim();
            const desc = document.getElementById('dev-app-desc').value.trim();

            if (!title || !url) {
                alert('يرجى إدخال اسم التطبيق والرابط الخاص به.');
                return;
            }

            const newApp = {
                id: 'app_' + Date.now(),
                title: title,
                type: 'url',
                url: url,
                company: company,
                developer: developer,
                version: version,
                desc: desc,
                icon: icon,
                bg: 'bg-emerald-600'
            };

            installedApps.push(newApp);
            localStorage.setItem('doors_ecosystem_apps', JSON.stringify(installedApps));

            alert(`تم تثبيت تطبيق "${title}" بنجاح في بيئة Doors وظهرت أيقونته على سطح المكتب!`);
            renderDesktop();
            renderStoreGrid();
        }

        function closeStoreWindow() {
            document.getElementById('doors-store-window').classList.add('hidden');
            document.getElementById('doors-store-window').classList.remove('flex');
        }

        function toggleZozenSearch() {
            const modal = document.getElementById('zozen-search-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) document.getElementById('zozen-search-input').focus();
        }

        function handleSearchKey(event) { if (event.key === 'Enter') executeZozenSearch(); }

        function executeZozenSearch() {
            const query = document.getElementById('zozen-search-input').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('zozen-search-results');
            resultsContainer.innerHTML = '';
            if (!query) return;

            const matches = installedApps.filter(app => app.title.toLowerCase().includes(query));
            let html = '';
            matches.forEach(app => {
                html += `
                    <div class="p-3 bg-slate-50 hover:bg-orange-50 border border-slate-200 rounded-xl transition flex items-center justify-between cursor-pointer" onclick="toggleZozenSearch(); launchApp('${app.id}');">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 ${app.bg} text-white rounded-lg flex items-center justify-center text-xs"><i class="${app.icon}"></i></div>
                            <div>
                                <div class="font-bold text-slate-900 text-xs">${app.title}</div>
                                <div class="text-[10px] text-slate-500">${app.company}</div>
                            </div>
                        </div>
                        <span class="bg-orange-600 text-white px-3 py-1 rounded-lg text-[11px] font-bold">تشغيل</span>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html || '<div class="text-center py-4 text-slate-400">لا توجد تطبيقات مطابقة</div>';
        }

        function renderDesktop() {
            const area = document.getElementById('desktop-area');
            area.innerHTML = '';
            installedApps.forEach((app, index) => {
                let col = Math.floor(index / 5);
                let row = index % 5;
                const div = document.createElement('div');
                div.className = "desktop-item flex flex-col items-center group p-2 rounded-xl hover:bg-black/5 transition";
                div.style.left = (25 + (col * 95)) + 'px';
                div.style.top = (25 + (row * 105)) + 'px';
                div.onclick = () => launchApp(app.id);
                div.innerHTML = `
                    <div class="w-14 h-14 ${app.bg || 'bg-orange-600'} rounded-2xl flex items-center justify-center text-white text-2xl shadow-md mb-1.5 group-hover:scale-105 transition">
                        <i class="${app.icon || 'fa-solid fa-cube'}"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 text-center">${app.title}</span>
                `;
                area.appendChild(div);
            });
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        renderDesktop();
    </script>
</body>
</html>

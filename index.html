        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            transition: background 0.35s ease;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        body.custom-cursor-active,
        body.custom-cursor-active * {
            cursor: none !important;
        }

        #doors-cursor {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-3px, -3px);
            will-change: left, top;
        }

        #doors-cursor .cursor-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 22px;
            height: 22px;
            border: 1.5px solid rgba(234, 88, 12, 0.5);
            border-radius: 50%;
            transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
        }

        #doors-cursor.hovering .cursor-ring {
            transform: scale(1.42);
            border-color: rgba(234, 88, 12, 0.95);
            background: rgba(234, 88, 12, 0.14);
        }

        #doors-cursor.clicking svg {
            transform: scale(0.86);
        }

        .desktop-item {
            position: absolute;
            width: 96px;
            padding: 8px 4px;
            border-radius: 14px;
            transition: background 0.15s ease, box-shadow 0.15s ease;
            touch-action: none;
        }

        .desktop-item:hover {
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(6px);
        }

        .desktop-item.selected {
            background: rgba(234, 88, 12, 0.2);
            box-shadow: inset 0 0 0 1.5px rgba(234, 88, 12, 0.75);
        }

        .os-window {
            position: absolute;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.38);
            display: flex;
            flex-direction: column;
            min-width: 440px;
            min-height: 300px;
            resize: both;
        }

        .os-window.maximized {
            top: 8px !important;
            left: 8px !important;
            width: calc(100vw - 16px) !important;
            height: calc(100vh - 76px) !important;
            resize: none;
        }

        .dragging-window iframe {
            pointer-events: none !important;
        }

        .context-menu {
            position: fixed;
            min-width: 245px;
            z-index: 99990;
            animation: popIn 0.12s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .submenu-trigger:hover .submenu-panel {
            display: block;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.65); border-radius: 10px; }
    </style>
</head>

        function checkSessionOnBoot() {
            const saved = localStorage.getItem('doors_active_session_v4') || sessionStorage.getItem('doors_active_session_v4');

            if (saved && db[saved]) {
                startUserSession(db[saved], true);

        function showAuthScreen() {
            const el = document.getElementById('auth-screen');
            el.classList.remove('hidden');
            el.classList.add('flex');
            renderSavedAccountsList();
        }

        function renderSavedAccountsList() {
            const db = getAccountsDB();
            const keys = Object.keys(db);
            const box = document.getElementById('saved-accounts-box');
            const list = document.getElementById('saved-accounts-list');
            if (!keys.length) {
                box.classList.add('hidden');
                return;
            }
            box.classList.remove('hidden');
            list.innerHTML = '';
            keys.forEach(u => {
                const acc = db[u];
                const prof = getProfileById(acc.profileId);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'flex items-center gap-2 bg-slate-100 hover:bg-orange-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold transition';
                btn.innerHTML = `<span class="w-5 h-5 rounded-md ${prof.bg} text-white text-[10px] flex items-center justify-center"><i class="fa-solid ${prof.icon}"></i></span><span>${acc.fullname}</span>`;
                btn.onclick = () => {
                    switchAuthTab('login');
                    document.getElementById('login-username').value = u;
                    document.getElementById('login-password').focus();
                };
                list.appendChild(btn);
            });
        }

        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('register-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = isLogin ? 'py-2 rounded-lg bg-white text-orange-600 shadow-sm transition' : 'py-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
            document.getElementById('tab-register').className = !isLogin ? 'py-2 rounded-lg bg-white text-orange-600 shadow-sm transition' : 'py-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
        }

        function handleRegister(e) {
            e.preventDefault();
            const fullname = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const language = document.getElementById('reg-language').value;
            const country = document.getElementById('reg-country').value;
            const profileId = Number(document.getElementById('reg-profile-id').value) || 1;
            const errEl = document.getElementById('reg-error');
            const db = getAccountsDB();

            if (db[username]) {
                errEl.textContent = 'Username already exists. Please choose another.';
                errEl.classList.remove('hidden');
                return;
            }

            const acc = {
                username,
                fullname,
                password,
                language,
                country,
                profileId,
                createdAt: new Date().toISOString()
            };
            db[username] = acc;
            saveAccountsDB(db);
            startUserSession(acc, true);
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('login-remember').checked;
            const errEl = document.getElementById('login-error');
            const db = getAccountsDB();
            const acc = db[username];

            if (!acc || acc.password !== password) {
                errEl.textContent = 'Invalid username or password.';
                errEl.classList.remove('hidden');
                return;
            }
            startUserSession(acc, remember);
        }

        function startUserSession(account, persist) {
            currentUser = account;
            userData = loadUserData(account.username);
            if (persist) localStorage.setItem('doors_active_session_v4', account.username);
            else sessionStorage.setItem('doors_active_session_v4', account.username);

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('flex');
            updateAccountUI();
            applySystemSettings();
            renderDesktop();
            renderStartApps();
        }

        function logoutSession() {
            localStorage.removeItem('doors_active_session_v4');
            sessionStorage.removeItem('doors_active_session_v4');
            Object.keys(openWindows).forEach(id => closeWindow(id));
            toggleStartMenu(false);
            currentUser = null;
            userData = null;
            showAuthScreen();
        }

        function applySystemSettings() {
            if (!userData) return;
            const s = userData.settings;
            if (s.customWallpaperUrl) {
                document.body.style.background = `url('${s.customWallpaperUrl}') center/cover no-repeat`;
            } else {
                const wp = WALLPAPERS[s.wallpaper] || WALLPAPERS.sovereign;
                document.body.style.background = wp.css;
            }
            const customCursorOn = s.customCursor !== false;
            document.body.classList.toggle('custom-cursor-active', customCursorOn);
            document.getElementById('doors-cursor').style.display = customCursorOn ? 'block' : 'none';
            renderDesktop();

        // =========================================================================
        // Desktop & File Types
        // =========================================================================
        function getAllApps() {
            return [...DEFAULT_APPS, ...(userData?.customApps || [])];
        }

        function getDesktopFSItems() {
            return (userData?.fsItems || []).filter(i => i.parentId === 'desktop');
        }

        function isHtmlExtension(name) {
            return /\.(html?|xhtml)$/i.test(name || '');
        }

        function isExecutableExtension(name) {
            return /\.(exe|bat|cmd|ps1|msi|vbs|sh)$/i.test(name || '');
        }

        function isWallpaperDark() {
            if (!userData) return false;
            if (userData.settings.customWallpaperUrl) return true;
            const wp = WALLPAPERS[userData.settings.wallpaper] || WALLPAPERS.sovereign;
            return !wp.textDark;
        }

        function renderDesktop() {
            if (!userData) return;
            const area = document.getElementById('desktop-area');
            area.innerHTML = '';

            const entities = [
                ...getAllApps().map(a => ({ kind: 'app', data: a, id: 'app_' + a.id })),
                ...getDesktopFSItems().map(f => ({ kind: 'fs', data: f, id: f.id }))
            ];

            const labelClass = !isWallpaperDark()
                ? 'text-slate-800 drop-shadow-[0_1px_1px_rgba(255,255,255,0.85)]'
                : 'text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.85)]';

            const maxRows = Math.max(4, Math.floor((window.innerHeight - 105) / 108));

            entities.forEach((entity, idx) => {
                const pos = userData.positions[entity.id] || {
                    x: 24 + Math.floor(idx / maxRows) * 102,
                    y: 22 + (idx % maxRows) * 106
                };

                const div = document.createElement('div');
                div.className = `desktop-item flex flex-col items-center group ${selectedItemId === entity.id ? 'selected' : ''}`;
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';
                div.dataset.entityId = entity.id;

                if (entity.kind === 'app') {
                    const app = entity.data;
                    div.innerHTML = `
                        <div class="w-14 h-14 ${app.bg || 'bg-orange-600'} rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition relative">
                            <i class="${app.icon || 'fa-solid fa-cube'}"></i>
                            ${app.isDefault ? '' : '<span class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full text-[8px] flex items-center justify-center"><i class="fa-solid fa-cloud"></i></span>'}
                        </div>
                        <span class="text-[11px] font-bold text-center leading-tight line-clamp-2 px-1 ${labelClass}">${app.title}</span>
                    `;
                } else {
                    const item = entity.data;
                    let iconBox = '';
                    if (item.type === 'folder') {
                        iconBox = `<div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-folder"></i></div>`;
                    } else if (item.type === 'html' || isHtmlExtension(item.name)) {
                        iconBox = `<div class="w-14 h-14 bg-gradient-to-br from-orange-500 to-rose-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-brands fa-html5"></i></div>`;
                    } else if (item.type === 'exe' || isExecutableExtension(item.name)) {
                        iconBox = `<div class="w-14 h-14 bg-gradient-to-br from-slate-700 to-slate-900 rounded-2xl flex items-center justify-center text-emerald-400 text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-terminal"></i></div>`;
                    } else {
                        iconBox = `<div class="w-14 h-14 bg-gradient-to-br from-sky-500 to-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-1.5 group-hover:scale-105 transition"><i class="fa-solid fa-code"></i></div>`;
                    }
                    div.innerHTML = `${iconBox}<span class="text-[11px] font-bold text-center leading-tight line-clamp-2 px-1 ${labelClass}">${item.name}</span>`;
                }

                enableDesktopIconDrag(div, entity);

                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    selectedItemId = entity.id;
                    highlightSelectedDesktopIcon();
                    showContextMenu(e.clientX, e.clientY, entity.kind, entity.data);
                });

                area.appendChild(div);
            });
        }

        function highlightSelectedDesktopIcon() {
            document.querySelectorAll('.desktop-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.entityId === selectedItemId);
            });
        }

        function enableDesktopIconDrag(el, entity) {
            let startX, startY, origX, origY, moved = false;
            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.stopPropagation();
                hideContextMenu();
                toggleStartMenu(false);
                selectedItemId = entity.id;
                highlightSelectedDesktopIcon();
                startX = e.clientX;
                startY = e.clientY;
                origX = parseInt(el.style.left, 10) || 0;
                origY = parseInt(el.style.top, 10) || 0;
                moved = false;

                function onMove(ev) {
                    if (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5) moved = true;
                    if (moved) {
                        el.style.left = Math.max(8, Math.min(window.innerWidth - 100, origX + ev.clientX - startX)) + 'px';
                        el.style.top = Math.max(8, Math.min(window.innerHeight - 165, origY + ev.clientY - startY)) + 'px';
                    }
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (moved) {
                        userData.positions[entity.id] = { x: parseInt(el.style.left, 10), y: parseInt(el.style.top, 10) };
                        saveUserData();
                    } else if (entity.kind === 'app') {
                        launchApp(entity.data.id);
                    } else {
                        openFSItem(entity.data.id);
                    }
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // =========================================================================
        // App Launching, Google Chrome & Doors Code Editor
        // =========================================================================
        function launchApp(appId, mode = 'default') {
            const app = getAllApps().find(a => a.id === appId);
            if (!app) return;

            if (app.type === 'doors_code') {
                openDoorsCodeEditor();
                return;
            }
            if (app.type === 'internal_chrome') {
                openInternalChromeWindow(app.url || 'https://www.google.com', app.title);
                return;
            }
            if (app.type === 'iframe_store') {
                openIframeWindow('store');
                return;
            }
            if (app.type === 'iframe_settings') {
                openIframeWindow('settings');
                return;
            }
            if (mode === 'chrome_internal') {
                openInternalChromeWindow(app.url, `${app.title} - Google Chrome`);
                return;
            }
            if (mode === 'newtab') {
                window.open(app.url, '_blank');
                return;
            }

            const width = Math.min(1180, window.screen.availWidth - 70);
            const height = Math.min(760, window.screen.availHeight - 70);
            const left = Math.round((window.screen.availWidth - width) / 2);
            const top = Math.round((window.screen.availHeight - height) / 2);
            const features = ['popup=yes', `width=${width}`, `height=${height}`, `left=${left}`, `top=${top}`, 'toolbar=no', 'menubar=no', 'location=no', 'status=no', 'scrollbars=yes', 'resizable=yes'].join(',');
            const win = window.open(app.url, 'DoorsStandalone_' + app.id, features);
            if (win) win.focus();
            else showInfoDialog('Popup Blocked', 'Please allow popups so apps open in their standalone window.');
        }

        function openInternalChromeWindow(initialTarget = 'https://www.google.com', customTitle = 'Google Chrome', htmlContentOverride = null) {
            const winId = 'doors_internal_chrome';
            const existing = openWindows[winId];

            const chromeHtml = `
                <div class="h-full flex flex-col bg-slate-100" dir="ltr">
                    <div class="bg-slate-200/90 px-2.5 pt-2 pb-1.5 border-b border-slate-300 flex items-center gap-2">
                        <div class="flex items-center gap-1">
                            <button id="chrome-back-btn" class="w-7 h-7 rounded-full hover:bg-slate-300/80 text-slate-700 flex items-center justify-center text-xs" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
                            <button id="chrome-forward-btn" class="w-7 h-7 rounded-full hover:bg-slate-300/80 text-slate-700 flex items-center justify-center text-xs" title="Forward"><i class="fa-solid fa-arrow-right"></i></button>
                            <button id="chrome-reload-btn" class="w-7 h-7 rounded-full hover:bg-slate-300/80 text-slate-700 flex items-center justify-center text-xs" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
                            <button id="chrome-home-btn" class="w-7 h-7 rounded-full hover:bg-slate-300/80 text-slate-700 flex items-center justify-center text-xs" title="Home"><i class="fa-solid fa-house"></i></button>
                        </div>
                        <div class="flex-1 flex items-center bg-white rounded-full px-3.5 py-1.5 border border-slate-300 shadow-inner gap-2">
                            <i class="fa-brands fa-chrome text-orange-600 text-sm"></i>
                            <input id="chrome-url-bar" type="text" class="flex-1 text-xs text-slate-800 focus:outline-none bg-transparent" placeholder="Enter URL or system .html file path...">
                            <button id="chrome-go-btn" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-0.5 rounded-full text-[11px] font-bold">Go</button>
                        </div>
                        <span class="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full shrink-0">Google Chrome</span>
                    </div>
                    <div class="flex-1 relative bg-white overflow-hidden">
                        <iframe id="chrome-internal-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
            `;

            const win = existing
                ? (focusWindow(winId), existing.el)
                : createOSWindow({
                    id: winId,
                    title: customTitle,
                    icon: 'fa-brands fa-chrome',
                    iconBg: 'bg-gradient-to-br from-red-500 via-amber-400 to-emerald-500',
                    width: 960,
                    height: 620,
                    contentHtml: chromeHtml
                });

            if (openWindows[winId]) {
                openWindows[winId].title = customTitle;
                win.querySelector('.win-title-text').textContent = customTitle;
                renderTaskbarWindows();
            }

            const frame = win.querySelector('#chrome-internal-frame');
            const bar = win.querySelector('#chrome-url-bar');
            const goBtn = win.querySelector('#chrome-go-btn');
            const backBtn = win.querySelector('#chrome-back-btn');
            const fwdBtn = win.querySelector('#chrome-forward-btn');
            const reloadBtn = win.querySelector('#chrome-reload-btn');
            const homeBtn = win.querySelector('#chrome-home-btn');

            function navigateChrome(target, htmlDoc = null) {
                bar.value = target;
                if (htmlDoc !== null) {
                    frame.removeAttribute('src');
                    frame.srcdoc = htmlDoc;
                } else {
                    let finalUrl = target.trim();
                    if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;
                    frame.removeAttribute('srcdoc');
                    frame.src = finalUrl;
                }
            }

            goBtn.onclick = () => navigateChrome(bar.value);
            bar.onkeydown = (e) => { if (e.key === 'Enter') navigateChrome(bar.value); };
            backBtn.onclick = () => { try { frame.contentWindow.history.back(); } catch (_) {} };
            fwdBtn.onclick = () => { try { frame.contentWindow.history.forward(); } catch (_) {} };
            reloadBtn.onclick = () => {
                if (frame.hasAttribute('srcdoc')) frame.srcdoc = frame.srcdoc;
                else frame.src = frame.src;
            };
            homeBtn.onclick = () => navigateChrome('https://www.google.com');

            navigateChrome(initialTarget, htmlContentOverride);
        }

        // Doors Code Editor (supports opening any editable file from desktop/folders or creating new code files)
        function openDoorsCodeEditor(fileId = null) {
            const winId = 'doors_code_studio';
            const editableFiles = (userData?.fsItems || []).filter(i => i.type !== 'folder');
            let activeFile = fileId ? editableFiles.find(f => f.id === fileId) : editableFiles[0];

            const editorHtml = `
                <div class="h-full flex flex-col bg-slate-900 text-slate-100" dir="ltr">
                    <!-- Top Toolbar -->
                    <div class="h-11 bg-slate-950 border-b border-slate-800 px-3 flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-sky-400 flex items-center gap-1.5"><i class="fa-solid fa-code"></i> Doors Code</span>
                            <select id="dc-file-select" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-sky-500"></select>
                            <button id="dc-new-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-lg font-semibold">+ New</button>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="dc-status" class="text-[11px] text-emerald-400 font-semibold">Saved</span>
                            <button id="dc-save-btn" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1 rounded-lg font-bold">Save</button>
                            <button id="dc-chrome-btn" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1 rounded-lg font-bold"><i class="fa-brands fa-chrome mr-1"></i> Run in Google Chrome</button>
                        </div>
                    </div>

                    <!-- Editor Body -->
                    <div class="flex-1 flex overflow-hidden">
                        <div id="dc-line-numbers" class="w-12 bg-slate-950/70 text-slate-500 code-font text-xs py-4 text-right pr-2.5 select-none overflow-hidden leading-6 border-r border-slate-800">1</div>
                        <textarea id="dc-textarea" spellcheck="false" class="flex-1 bg-slate-900 text-emerald-300 code-font text-xs p-4 leading-6 focus:outline-none resize-none" placeholder="Write your code here in Doors Code..."></textarea>
                    </div>
                </div>
            `;

            const win = openWindows[winId]
                ? (focusWindow(winId), openWindows[winId].el)
                : createOSWindow({
                    id: winId,
                    title: 'Doors Code - Code Editor',
                    icon: 'fa-solid fa-code',
                    iconBg: 'bg-sky-600',
                    width: 860,
                    height: 560,
                    contentHtml: editorHtml
                });

            const sel = win.querySelector('#dc-file-select');
            const ta = win.querySelector('#dc-textarea');
            const linesEl = win.querySelector('#dc-line-numbers');
            const statusEl = win.querySelector('#dc-status');
            const saveBtn = win.querySelector('#dc-save-btn');
            const chromeBtn = win.querySelector('#dc-chrome-btn');
            const newBtn = win.querySelector('#dc-new-btn');

            function refreshFileSelector(currentId) {
                const files = (userData?.fsItems || []).filter(i => i.type !== 'folder');
                sel.innerHTML = files.map(f => `<option value="${f.id}" ${f.id === currentId ? 'selected' : ''}>${f.name}</option>`).join('');
            }

            function updateLineNumbers() {
                const count = (ta.value || '').split('\n').length;
                linesEl.innerHTML = Array.from({ length: count }, (_, i) => i + 1).join('<br>');
            }

            function loadFileIntoEditor(id) {
                activeFile = (userData?.fsItems || []).find(f => f.id === id);
                if (!activeFile) {
                    ta.value = '';
                    updateLineNumbers();
                    return;
                }
                ta.value = activeFile.content || '';
                updateLineNumbers();
                win.querySelector('.win-title-text').textContent = `Doors Code — ${activeFile.name}`;
                if (openWindows[winId]) {
                    openWindows[winId].title = `Doors Code — ${activeFile.name}`;
                    renderTaskbarWindows();
                }
            }

            function saveCurrentCode() {
                if (!activeFile) return;
                activeFile.content = ta.value;
                activeFile.updatedAt = new Date().toISOString();
                saveUserData();
                statusEl.textContent = 'Saved ✓';
            }

            ta.oninput = () => {
                updateLineNumbers();
                saveCurrentCode();
            };

            ta.onscroll = () => {
                linesEl.scrollTop = ta.scrollTop;
            };

            sel.onchange = () => loadFileIntoEditor(sel.value);
            saveBtn.onclick = saveCurrentCode;

            chromeBtn.onclick = () => {
                saveCurrentCode();
                const name = activeFile ? activeFile.name : 'preview.html';
                const htmlCode = isHtmlExtension(name)
                    ? ta.value
                    : `<!DOCTYPE html><html><body style="font-family:monospace;padding:24px;background:#0f172a;color:#38bdf8;"><h2>${escapeHtml(name)}</h2><pre>${escapeHtml(ta.value)}</pre></body></html>`;
                openInternalChromeWindow(`doors://code/${name}`, `${name} - Google Chrome`, htmlCode);
            };

            newBtn.onclick = () => {
                closeWindow(winId);
                createNewItemPrompt('code', 'desktop');
            };

            refreshFileSelector(activeFile?.id);
            if (activeFile) loadFileIntoEditor(activeFile.id);
            else { ta.value = ''; updateLineNumbers(); }
        }

        function openFSItem(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;

            if (item.type === 'folder') {
                openFolderWindow(item.id);
            } else if (item.type === 'html' || isHtmlExtension(item.name)) {
                openInternalChromeWindow(`doors://system/${item.name}`, `${item.name} - Google Chrome`, item.content || '<h1>Empty HTML File</h1>');
            } else if (item.type === 'exe' || isExecutableExtension(item.name)) {
                runWindowsLikeExecutable(item);
            } else {
                // Any editable code/text file opens in Doors Code by default
                openDoorsCodeEditor(item.id);
            }
        }

        function runWindowsLikeExecutable(item) {
            const winId = 'win_runner_' + item.id;
            const lines = (item.content || `Executing ${item.name}...`)
                .split('\n')
                .filter(Boolean)
                .map(l => l.replace(/^@?echo\s+/i, ''));

            const html = `
                <div dir="ltr" class="h-full bg-slate-950 text-emerald-400 code-font p-4 text-xs overflow-y-auto space-y-1.5">
                    <div class="text-slate-400">Doors Windows-Compat Runtime [v4.0]</div>
                    <div class="pt-2 text-amber-300">C:\\Doors\\${escapeHtml(currentUser.username)}&gt; ${escapeHtml(item.name)}</div>
                    ${lines.map(line => `<div>&gt; ${escapeHtml(line)}</div>`).join('')}
                    <div class="pt-2 text-emerald-300">[Process exited with code 0]</div>
                </div>
            `;

            createOSWindow({
                id: winId,
                title: `Run: ${item.name}`,
                icon: 'fa-solid fa-terminal',
                iconBg: 'bg-slate-900',
                width: 640,
                height: 380,
                contentHtml: html
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        // =========================================================================
        // Folders, File Creation, Rename, Delete & Properties
        // =========================================================================
        function openFolderWindow(folderId) {
            const folder = userData.fsItems.find(i => i.id === folderId);
            if (!folder) return;
            const winId = 'folder_' + folderId;
            if (openWindows[winId]) { focusWindow(winId); renderFolderContents(folderId); return; }

            createOSWindow({
                id: winId,
                title: folder.name,
                icon: 'fa-solid fa-folder-open',
                iconBg: 'bg-amber-500',
                width: 700,
                height: 470,
                contentHtml: `
                    <div dir="ltr" class="h-full flex flex-col bg-slate-50">
                        <div class="p-3 bg-white border-b border-slate-200 flex items-center justify-between gap-2 text-xs">
                            <div class="font-bold text-slate-600 flex items-center gap-2"><i class="fa-solid fa-folder text-amber-500"></i><span>${folder.name}</span></div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="createNewItemPrompt('folder', '${folderId}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-2.5 py-1.5 rounded-xl font-bold">Folder</button>
                                <button onclick="createNewItemPrompt('code', '${folderId}')" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 px-2.5 py-1.5 rounded-xl font-bold">Code</button>
                                <button onclick="createNewItemPrompt('html', '${folderId}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-2.5 py-1.5 rounded-xl font-bold">.html</button>
                            </div>
                        </div>
                        <div id="folder-grid-${folderId}" class="flex-1 p-4 grid grid-cols-3 sm:grid-cols-5 gap-3 content-start overflow-y-auto"></div>
                    </div>
                `
            });
            renderFolderContents(folderId);
        }

        function renderFolderContents(folderId) {
            const grid = document.getElementById('folder-grid-' + folderId);
            if (!grid) return;
            const children = userData.fsItems.filter(i => i.parentId === folderId);
            if (!children.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-14 text-slate-400 text-xs">This folder is empty.</div>`;
                return;
            }
            grid.innerHTML = '';
            children.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flex flex-col items-center p-2.5 rounded-xl hover:bg-white border border-transparent hover:border-slate-200 transition text-center';
                const isHtml = item.type === 'html' || isHtmlExtension(item.name);
                const iconClass = item.type === 'folder' ? 'fa-solid fa-folder bg-amber-400'
                    : isHtml ? 'fa-brands fa-html5 bg-orange-600'
                    : 'fa-solid fa-code bg-sky-500';
                const parts = iconClass.split(' ');
                card.innerHTML = `<div class="w-12 h-12 ${parts[2]} text-white rounded-xl flex items-center justify-center text-xl mb-1.5 shadow"><i class="${parts[0]} ${parts[1]}"></i></div><span class="text-[11px] font-bold text-slate-700 line-clamp-2">${item.name}</span>`;
                card.onclick = () => openFSItem(item.id);
                card.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(e.clientX, e.clientY, 'fs', item); };
                grid.appendChild(card);
            });
        }

        function createNewItemPrompt(type, parentId = 'desktop') {
            const presets = {
                folder: { title: 'New Folder', def: 'New Folder' },
                code: { title: 'New Code File (Doors Code)', def: 'script.js' },
                html: { title: 'New HTML File (Opens in Google Chrome)', def: 'index.html' },
                exe: { title: 'New Executable Script', def: 'run.bat' }
            };
            const cfg = presets[type] || presets.code;
            openDialog(cfg.title, `
                <div class="space-y-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">File or Folder Name</label>
                        <input type="text" id="prompt-item-name" value="${cfg.def}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button onclick="closeDialog()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold">Cancel</button>
                        <button onclick="confirmCreateItem('${type}', '${parentId}')" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">Create</button>
                    </div>
                </div>
            `);
        }

        function confirmCreateItem(type, parentId) {
            const name = document.getElementById('prompt-item-name').value.trim();
            if (!name) return;
            const defaultContent = (type === 'html' || isHtmlExtension(name))
                ? `<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="UTF-8"><title>${name}</title></head>\n<body style="font-family:sans-serif;padding:24px;">\n  <h1>${name}</h1>\n  <p>Running in Google Chrome inside Doors OS.</p>\n</body>\n</html>`
                : type === 'folder' ? '' : `// ${name} - Doors Code\n`;

            const newItem = {
                id: type + '_' + Date.now(),
                parentId,
                type,
                name,
                content: defaultContent,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            userData.fsItems.push(newItem);
            saveUserData();
            closeDialog();
            if (parentId === 'desktop') renderDesktop();
            else renderFolderContents(parentId);
            if (type === 'code') openDoorsCodeEditor(newItem.id);
        }

        function openCreateShortcutDialog() {
            openDialog('Add App Shortcut', `
                <div class="space-y-3">
                    <div>

        function renameFSItemPrompt(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;
            openDialog('Rename', `
                <div class="space-y-4">
                    <input type="text" id="rename-input" value="${item.name}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5">
                    <div class="flex justify-end gap-2">
                        <button onclick="closeDialog()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold">Cancel</button>
                        <button onclick="confirmRenameFS('${itemId}')" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">Save</button>
                    </div>
                </div>
            `);
        }

        function confirmRenameFS(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            const val = document.getElementById('rename-input').value.trim();
            if (!item || !val) return;
            item.name = val;
            if (isHtmlExtension(val)) item.type = 'html';
            else if (isExecutableExtension(val)) item.type = 'exe';
            saveUserData();
            closeDialog();
            renderDesktop();
            if (item.parentId !== 'desktop') renderFolderContents(item.parentId);
        }

        function deleteFSItem(itemId) {
            const item = userData.fsItems.find(i => i.id === itemId);
            if (!item) return;
            const toDelete = new Set([itemId]);
            let expanded = true;
            while (expanded) {
                expanded = false;
                userData.fsItems.forEach(i => {
                    if (toDelete.has(i.parentId) && !toDelete.has(i.id)) {
                        toDelete.add(i.id);
                        expanded = true;
                    }
                });
            }
            userData.fsItems = userData.fsItems.filter(i => !toDelete.has(i.id));
            delete userData.positions[itemId];
            saveUserData();
            closeWindow('folder_' + itemId);
            renderDesktop();
            if (item.parentId !== 'desktop') renderFolderContents(item.parentId);
        }

        function deleteCustomApp(appId) {
            const app = getAllApps().find(a => a.id === appId);
            if (!app) return;
            if (app.isDefault) {
                showInfoDialog('Protected Default App', `"${app.title}" is a protected default app in Doors OS and cannot be deleted.`);
                return;
            }
            userData.customApps = userData.customApps.filter(a => a.id !== appId);
            delete userData.positions['app_' + appId];
            saveUserData();
            renderDesktop();
            renderStartApps();
        }

        function buildStoreIframeHTML() {
            return `<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="https://cdn.tailwindcss.com"><\/script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:'Inter',sans-serif;margin:0;background:#f8fafc;}</style></head>
            <body class="p-6 overflow-y-auto">
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-indigo-600 text-white rounded-2xl p-5 flex items-center justify-between">
                        <div><h1 class="font-extrabold text-base">Zozen Store</h1><p class="text-xs text-indigo-100">Connected to Supabase</p></div>
                        <button onclick="loadCloud()" class="bg-white/15 px-3 py-1.5 rounded-xl text-xs font-bold">Refresh</button>
                    </div>
                    <div id="cloud-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 text-xs">Loading cloud apps...</div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3 text-xs">
                        <h3 class="font-extrabold text-orange-600 text-sm">Developer Portal (Publish to Supabase)</h3>
                        <input id="n" type="text" placeholder="App Name *" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <input id="u" type="url" placeholder="App URL (https://...) *" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <input id="d" type="text" placeholder="Description" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <button onclick="pub()" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl">Publish App</button>
                    </div>
                </div>
                <script>
                    const sb = supabase.createClient("${SUPABASE_URL}","${SUPABASE_ANON_KEY}");
                    let cloudList = [];
                    async function loadCloud(){
                        const g = document.getElementById('cloud-grid');
                        try{
                            const {data,error} = await sb.from('apps').select('*').order('id',{ascending:false});
                            if(error) throw error;
                            cloudList = data || [];
                            g.innerHTML = cloudList.length ? '' : '<p class="text-slate-400">No cloud apps available.</p>';
                            cloudList.forEach((a,i)=>{
                                g.innerHTML += '<div class="bg-white border border-slate-200 p-4 rounded-2xl flex items-center justify-between"><div><div class="font-bold text-sm">'+(a.name||'Cloud App')+'</div><div class="text-slate-500">'+(a.description||'')+'</div></div><button onclick="installApp('+i+')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-bold">Install</button></div>';
                            });
                        }catch(e){g.innerHTML='<p class="text-red-500">Connection error: '+e.message+'</p>';}
                    }
                    function installApp(i){
                        const a = cloudList[i];
                        window.parent.postMessage({source:'doors_store',action:'installApp',payload:{name:a.name||'Cloud App',url:a.exe_url||a.file_url||'#',developer:a.developer||'Developer',desc:a.description||''}},'*');
                    }
                    async function pub(){
                        const name=document.getElementById('n').value.trim(), url=document.getElementById('u').value.trim(), desc=document.getElementById('d').value.trim();
                        if(!name||!url) return alert('Enter name and URL');
                        const {error}=await sb.from('apps').insert([{name,developer:'Zozen Dev',description:desc||'v1.0',exe_url:url}]);
                        if(error) return alert(error.message);
                        alert('Published!'); loadCloud();
                    }
                    loadCloud();
                <\/script>
                ${getIframeCustomCursorCode()}
            </body></html>`;
        }

        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (!msg || !msg.source) return;
            if (msg.source === 'doors_settings') {
                const db = getAccountsDB();
                if (msg.action === 'updateName' && msg.payload.fullname) {
                    currentUser.fullname = msg.payload.fullname;
                    db[currentUser.username] = currentUser;
                    saveAccountsDB(db);
                    updateAccountUI();
                } else if (msg.action === 'setProfile') {
                    currentUser.profileId = msg.payload.profileId;
                    db[currentUser.username] = currentUser;
                    saveAccountsDB(db);
                    updateAccountUI();
                    const f = document.getElementById('iframe-settings');
                    if (f) f.srcdoc = buildSettingsIframeHTML();
                } else if (msg.action === 'setLocale') {
                    currentUser.language = msg.payload.language;
                    currentUser.country = msg.payload.country;
                    db[currentUser.username] = currentUser;
                    saveAccountsDB(db);
                    updateAccountUI();
                } else if (msg.action === 'setWallpaper') {
                    userData.settings.wallpaper = msg.payload.wallpaper;
                    userData.settings.customWallpaperUrl = msg.payload.customUrl || '';
                    saveUserData();
                    applySystemSettings();
                } else if (msg.action === 'toggleCursor') {
                    userData.settings.customCursor = msg.payload.enabled;
                    saveUserData();
                    applySystemSettings();
                    const f = document.getElementById('iframe-settings');
                    if (f) f.srcdoc = buildSettingsIframeHTML();
                } else if (msg.action === 'logout') {
                    logoutSession();
                }
            }
            if (msg.source === 'doors_store' && msg.action === 'installApp') {
                const { name, url, developer, desc } = msg.payload;
                if (!userData.customApps.some(a => a.url === url)) {
                    userData.customApps.push({ id: 'cloud_' + Date.now(), title: name, type: 'url', url, company: developer, desc, icon: 'fa-solid fa-cloud', bg: 'bg-emerald-600', isDefault: false });
                    saveUserData();
                    renderDesktop();
                    renderStartApps();
                    showInfoDialog('Installed', `"${name}" has been installed to your desktop.`);
                }
            }
        });

                    : `<button onclick="hideContextMenu(); deleteCustomApp('${data.id}')" class="w-full px-3.5 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2.5 font-bold"><i class="fa-solid fa-trash w-4"></i> Delete</button>`;

                html = `
                    <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 truncate">${data.title}</div>
                    <button onclick="hideContextMenu(); launchApp('${data.id}')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-bold"><i class="fa-solid fa-play text-orange-600 w-4"></i> Open</button>
                    ${data.type === 'url' ? `
                    <div class="relative submenu-trigger">
                        <div class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center justify-between font-semibold">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-arrow-up-right-from-square text-indigo-500 w-4"></i> Open With...</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </div>
                        <div class="submenu-panel hidden absolute top-0 left-full ml-1 w-52 bg-white/95 border border-slate-200 rounded-xl shadow-xl py-1.5">
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'default')" class="w-full px-3 py-2 hover:bg-orange-50 flex items-center gap-2 font-semibold text-left"><i class="fa-solid fa-window-restore text-orange-500 w-4"></i> Standalone Window</button>
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'chrome_internal')" class="w-full px-3 py-2 hover:bg-amber-50 flex items-center gap-2 font-semibold text-left"><i class="fa-brands fa-chrome text-orange-600 w-4"></i> Google Chrome</button>
                            <button onclick="hideContextMenu(); launchApp('${data.id}', 'newtab')" class="w-full px-3 py-2 hover:bg-slate-100 flex items-center gap-2 font-semibold text-left"><i class="fa-solid fa-up-right-from-square text-blue-500 w-4"></i> Browser Tab</button>

                    <button onclick="hideContextMenu(); showPropertiesDialog('app', getAllApps().find(a=>a.id==='${data.id}'))" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5 font-semibold"><i class="fa-solid fa-circle-info text-slate-500 w-4"></i> Properties</button>

                    <button onclick="hideContextMenu(); openFSItem('${data.id}')" class="w-full px-3.5 py-2 hover:bg-orange-50 hover:text-orange-600 flex items-center gap-2.5 font-bold"><i class="fa-solid fa-folder-open text-orange-600 w-4"></i> Open</button>
                    ${data.type !== 'folder' ? `
                    <div class="relative submenu-trigger">
                        <div class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center justify-between font-semibold">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-sliders text-sky-500 w-4"></i> Open With...</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </div>
                        <div class="submenu-panel hidden absolute top-0 left-full ml-1 w-52 bg-white/95 border border-slate-200 rounded-xl shadow-xl py-1.5">
                            <button onclick="hideContextMenu(); openInternalChromeWindow('doors://open/${data.name}','${data.name} - Google Chrome',userData.fsItems.find(x=>x.id==='${data.id}').content)" class="w-full px-3 py-2 hover:bg-amber-50 flex items-center gap-2 font-semibold text-left"><i class="fa-brands fa-chrome text-orange-600 w-4"></i> Google Chrome</button>

                    <div class="my-1.5 border-t border-slate-100"></div>

        function hideContextMenu() { document.getElementById('context-menu').classList.add('hidden'); }

        document.getElementById('desktop-area').addEventListener('contextmenu', (e) => {
            if (e.target.closest('.desktop-item')) return;
            e.preventDefault();
            selectedItemId = null;
            highlightSelectedDesktopIcon();
            showContextMenu(e.clientX, e.clientY, 'desktop');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#context-menu')) hideContextMenu();
            if (!e.target.closest('#doors-start-menu') && !e.target.closest('#doors-start-btn')) toggleStartMenu(false);
        });

        function createOSWindow({ id, title, icon, iconBg, width = 820, height = 560, contentHtml }) {
            if (openWindows[id]) { focusWindow(id); openWindows[id].el.classList.remove('hidden'); return openWindows[id].el; }
            const win = document.createElement('div');
            win.id = 'win_' + id;
            win.className = 'os-window pointer-events-auto bg-white/95 backdrop-blur-2xl border border-slate-200/90';
            const w = Math.min(width, window.innerWidth - 40);
            const h = Math.min(height, window.innerHeight - 100);
            const offset = (Object.keys(openWindows).length % 5) * 26;
            win.style.width = w + 'px';
            win.style.height = h + 'px';
            win.style.left = Math.max(20, (window.innerWidth - w) / 2 + offset) + 'px';
            win.style.top = Math.max(16, (window.innerHeight - h - 70) / 2 + offset) + 'px';
            win.style.zIndex = ++topZIndex;
            win.innerHTML = `
                <div class="win-header h-11 bg-slate-100/95 border-b border-slate-200 px-3.5 flex items-center justify-between shrink-0 select-none" dir="ltr">
                    <div class="flex items-center gap-2.5">
                        <div class="w-6 h-6 ${iconBg || 'bg-orange-600'} text-white rounded-lg flex items-center justify-center text-xs"><i class="${icon}"></i></div>
                        <span class="font-bold text-xs text-slate-800 win-title-text">${title}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="minimizeWindow('${id}')" class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs"><i class="fa-solid fa-minus"></i></button>
                        <button onclick="toggleMaximizeWindow('${id}')" class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs"><i class="fa-regular fa-square"></i></button>
                        <button onclick="closeWindow('${id}')" class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="win-body flex-1 w-full h-full overflow-hidden relative bg-white">${contentHtml}</div>
            `;
            win.addEventListener('mousedown', () => focusWindow(id));
            const header = win.querySelector('.win-header');
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('button') || win.classList.contains('maximized')) return;
                focusWindow(id);
                document.body.classList.add('dragging-window');
                const sx = e.clientX, sy = e.clientY, ol = win.offsetLeft, ot = win.offsetTop;
                function onMove(ev) {
                    win.style.left = Math.max(-win.offsetWidth + 120, ol + ev.clientX - sx) + 'px';
                    win.style.top = Math.max(0, Math.min(window.innerHeight - 105, ot + ev.clientY - sy)) + 'px';
                }
                function onUp() {
                    document.body.classList.remove('dragging-window');
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            document.getElementById('windows-layer').appendChild(win);
            openWindows[id] = { el: win, title, icon, iconBg };
            renderTaskbarWindows();
            return win;
        }

        function focusWindow(id) { if (!openWindows[id]) return; openWindows[id].el.style.zIndex = ++topZIndex; openWindows[id].el.classList.remove('hidden'); renderTaskbarWindows(); }
        function minimizeWindow(id) { if (!openWindows[id]) return; openWindows[id].el.classList.add('hidden'); renderTaskbarWindows(); }
        function toggleMaximizeWindow(id) { if (!openWindows[id]) return; openWindows[id].el.classList.toggle('maximized'); }
        function closeWindow(id) { if (!openWindows[id]) return; openWindows[id].el.remove(); delete openWindows[id]; renderTaskbarWindows(); }

        function renderTaskbarWindows() {
            const c = document.getElementById('taskbar-windows');
            c.innerHTML = '';
            Object.entries(openWindows).forEach(([id, info]) => {
                const hidden = info.el.classList.contains('hidden');
                const b = document.createElement('button');
                b.className = `h-9 px-3 rounded-xl border text-xs font-bold flex items-center gap-2 transition shrink-0 ${hidden ? 'bg-slate-100 border-slate-200 text-slate-600' : 'bg-orange-50 border-orange-300 text-orange-700'}`;
                b.innerHTML = `<i class="${info.icon}"></i><span class="max-w-[110px] truncate">${info.title}</span>`;
                b.onclick = () => hidden ? focusWindow(id) : minimizeWindow(id);
                c.appendChild(b);
            });
        }

        function toggleStartMenu(forceState) {
            const m = document.getElementById('doors-start-menu');
            const open = forceState !== undefined ? forceState : m.classList.contains('hidden');
            m.classList.toggle('hidden', !open);
            m.classList.toggle('flex', open);
            if (open) { document.getElementById('start-search-input').value = ''; renderStartApps(); }
        }

        function renderStartApps(filter = '') {
            const g = document.getElementById('start-apps-grid');
            if (!g) return;
            const q = filter.trim().toLowerCase();
            g.innerHTML = '';
            getAllApps().filter(a => a.title.toLowerCase().includes(q) || (a.enTitle && a.enTitle.toLowerCase().includes(q))).forEach(app => {
                const btn = document.createElement('button');
                btn.className = 'flex flex-col items-center p-2.5 rounded-xl hover:bg-orange-50 transition';
                btn.innerHTML = `<div class="w-10 h-10 ${app.bg} text-white rounded-xl flex items-center justify-center text-base shadow mb-1.5"><i class="${app.icon}"></i></div><span class="text-[11px] font-bold text-slate-700 truncate w-full text-center">${app.title}</span>`;
                btn.onclick = () => { toggleStartMenu(false); launchApp(app.id); };
                g.appendChild(btn);
            });
        }

        function filterStartApps() { renderStartApps(document.getElementById('start-search-input').value); }

        function toggleZozenSearch() {
            const m = document.getElementById('zozen-search-modal');
            const open = m.classList.contains('hidden');
            m.classList.toggle('hidden', !open);
            m.classList.toggle('flex', open);
            if (open) { const i = document.getElementById('zozen-search-input'); i.value = ''; i.focus(); executeZozenSearch(); }
        }

        function executeZozenSearch() {
            const q = document.getElementById('zozen-search-input').value.trim().toLowerCase();
            const res = document.getElementById('zozen-search-results');
            let html = '';
            getAllApps().filter(a => !q || a.title.toLowerCase().includes(q) || (a.enTitle && a.enTitle.toLowerCase().includes(q))).forEach(a => {
                html += `<div onclick="toggleZozenSearch(); launchApp('${a.id}')" class="p-3 bg-slate-50 hover:bg-orange-50 border border-slate-200 rounded-xl flex items-center justify-between"><div class="flex items-center gap-2.5"><div class="w-8 h-8 ${a.bg} text-white rounded-lg flex items-center justify-center text-xs"><i class="${a.icon}"></i></div><span class="font-bold text-slate-800">${a.title}</span></div><span class="bg-orange-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">Open</span></div>`;
            });
            (userData?.fsItems || []).filter(f => !q || f.name.toLowerCase().includes(q)).forEach(f => {
                html += `<div onclick="toggleZozenSearch(); openFSItem('${f.id}')" class="p-3 bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl flex items-center justify-between"><div class="flex items-center gap-2.5"><div class="w-8 h-8 bg-amber-500 text-white rounded-lg flex items-center justify-center text-xs"><i class="fa-solid fa-file-code"></i></div><span class="font-bold text-slate-800">${f.name}</span></div><span class="bg-slate-800 text-white px-3 py-1 rounded-lg text-[10px] font-bold">Open</span></div>`;
            });
            res.innerHTML = html || '<div class="text-center py-6 text-slate-400">No matching results</div>';
        }

        function openDialog(title, bodyHtml) {
            document.getElementById('dialog-title').textContent = title;
            document.getElementById('dialog-body').innerHTML = bodyHtml;
            const d = document.getElementById('system-dialog');
            d.classList.remove('hidden'); d.classList.add('flex');
        }
        function showInfoDialog(title, message) {
            openDialog(title, `<p class="text-slate-600 leading-relaxed mb-4">${message}</p><div class="flex justify-end"><button onclick="closeDialog()" class="px-5 py-2 rounded-xl bg-orange-600 text-white font-bold">OK</button></div>`);
        }
        function closeDialog() {
            const d = document.getElementById('system-dialog');
            d.classList.add('hidden'); d.classList.remove('flex');
        }

        const cursorEl = document.getElementById('doors-cursor');
        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('custom-cursor-active')) return;
            cursorEl.style.opacity = '1';
            cursorEl.style.left = e.clientX + 'px';
            cursorEl.style.top = e.clientY + 'px';
            cursorEl.classList.toggle('hovering', Boolean(e.target.closest('button, a, input, textarea, select, .desktop-item, .submenu-trigger')));
        });
        document.addEventListener('mousedown', () => cursorEl.classList.add('clicking'));
        document.addEventListener('mouseup', () => cursorEl.classList.remove('clicking'));
        document.addEventListener('mouseleave', () => cursorEl.style.opacity = '0');

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock-date').textContent = now.toLocaleDateString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        initAuthFormOptions();
        checkSessionOnBoot();
    </script>
</body>
</html>
